<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="💎DMVJY💎 — asistente de inteligencia artificial educativa de TecnoMath.">
<title>💎DMVJY💎 · IA educativa</title>
<style>
:root{
 --sidebar:#f9f9f9;--white:#fff;--ink:#0d0d0d;--ash:#5d5d5d;--hollow:#8f8f8f;
 --hair:#0000001a;--hover:#0000000d;--press:#000;--deep:#00000080;--edge:#e6e6e6;
 --r:10px;--link-r:16px;--max:768px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--white)}
button,textarea{font:inherit}
button{color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:272px minmax(0,1fr)}
.sidebar{background:var(--sidebar);border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:100vh;padding:12px}
.brand{display:flex;align-items:center;gap:9px;padding:8px 10px 18px;font-weight:600;font-size:15px}
.diamond{font-size:18px}
.new-chat{width:100%;display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--hair);border-radius:var(--r);background:var(--white);cursor:pointer;font-weight:500}
.new-chat:hover,.nav-item:hover,.conversation:hover{background:var(--hover)}
.section-label{padding:20px 10px 8px;color:var(--hollow);font-size:12px;font-weight:600}
.conversations{display:flex;flex-direction:column;gap:2px;overflow:auto}
.conversation{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:var(--r);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nav{margin-top:auto;padding-top:12px;border-top:1px solid var(--hair)}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r);text-decoration:none;color:var(--ash);font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;border-bottom:1px solid var(--hair);display:flex;align-items:center;padding:0 20px;justify-content:space-between}
.topbar-title{font-size:14px;font-weight:600}
.status{font-size:12px;color:var(--hollow)}
.mobile-menu{display:none;border:0;background:transparent;cursor:pointer;font-size:18px}
.chat{width:min(100%,var(--max));margin:0 auto;flex:1;display:flex;flex-direction:column;padding:30px 20px 20px}
.welcome{margin:auto 0 28px}
.welcome h1{font-size:24px;line-height:1.33;margin:0 0 8px;font-weight:600;letter-spacing:-.02em}
.welcome p{margin:0;color:var(--ash);font-size:14px;line-height:1.5}
.suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.suggestion{border:1px solid var(--hair);background:var(--white);border-radius:var(--r);padding:8px 10px;font-size:13px;cursor:pointer}
.suggestion:hover{background:var(--hover)}
.messages{display:flex;flex-direction:column;gap:20px;padding-bottom:22px}
.message{display:flex;gap:10px;line-height:1.5;font-size:14px}
.message.user{justify-content:flex-end}
.bubble{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{background:var(--ink);color:var(--white);padding:10px 12px;border-radius:var(--r)}
.assistant .bubble{color:var(--ink);padding:2px 0}
.avatar{width:26px;height:26px;border:1px solid var(--hair);border-radius:50%;display:grid;place-items:center;flex:0 0 26px;font-size:12px}
.composer-wrap{position:sticky;bottom:0;background:linear-gradient(var(--white),var(--white));padding-top:8px}
.composer{border:1px solid var(--hair);border-radius:var(--r);background:var(--white);padding:10px;display:flex;align-items:flex-end;gap:8px}
.composer:focus-within{border-color:#00000040}
textarea{resize:none;border:0;outline:0;width:100%;max-height:180px;min-height:24px;line-height:1.5;font-size:14px;background:transparent;color:var(--ink)}
.send{width:34px;height:34px;border:1px solid var(--hair);border-radius:var(--r);background:var(--ink);color:var(--white);cursor:pointer;flex:0 0 34px}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:11px;color:var(--hollow);text-align:center;padding:7px 0 0}
.typing{color:var(--hollow)}
.error{color:var(--ash);border-left:2px solid var(--ink);padding-left:10px}
@media(max-width:760px){
 .app{display:block}
 .sidebar{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-102%);transition:transform .18s ease;box-shadow:none}
 .sidebar.open{transform:translateX(0)}
 .mobile-menu{display:block}
 .topbar{padding:0 14px}
 .chat{padding:24px 14px 14px}
 .welcome h1{font-size:24px}
}
</style>
    <script src="/js/i18n.js" defer></script>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><span class="diamond">💎</span><span>DMVJY</span><span class="diamond">💎</span></div>
 <button class="new-chat" id="newChat"><span>＋</span> Nueva conversación</button>
 <div class="section-label">Conversaciones</div>
 <div class="conversations" id="history"></div>
 <div class="nav">
  <a class="nav-item" href="../../index.html"><span>←</span> Volver a TecnoMath</a>
 </div>
</aside>
<main class="main">
 <header class="topbar">
  <button class="mobile-menu" id="menu" aria-label="Abrir menú">☰</button>
  <div class="topbar-title">💎DMVJY💎</div>
  <div class="status" id="status">IA educativa</div>
 </header>
 <section class="chat">
  <div class="welcome" id="welcome">
   <h1>¿Qué quieres aprender hoy?</h1>
   <p>Pregunta sobre matemáticas, ciencias, español, tecnología o cualquier tema escolar. Te explicaré el proceso para que puedas aprenderlo.</p>
   <div class="suggestions">
    <button class="suggestion">Ecuaciones</button>
    <button class="suggestion">Ciencias</button>
    <button class="suggestion">Matemáticas</button>
    <button class="suggestion">Español</button>
   </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer-wrap">
   <div class="composer">
    <textarea id="input" rows="1" maxlength="4000" placeholder="Pregunta a DMVJY…"></textarea>
    <button class="send" id="send" aria-label="Enviar" disabled>↑</button>
   </div>
   <div class="hint">DMVJY puede equivocarse. Verifica información importante.</div>
  </div>
 </section>
</main>
</div>
<script>
"use strict";
const API="https://xdszveoxdrdnwwzzvkav.supabase.co/functions/v1/ai-chat";
const $=id=>document.getElementById(id);
const input=$("input"),send=$("send"),messagesEl=$("messages"),welcome=$("welcome"),historyEl=$("history");
let messages=[],busy=false;
const saved=JSON.parse(localStorage.getItem("dmvjy-history")||"[]");
function renderHistory(){historyEl.innerHTML="";saved.slice(-12).reverse().forEach((item,i)=>{const b=document.createElement("button");b.className="conversation";b.textContent=item.title||"Conversación";b.onclick=()=>loadConversation(item);historyEl.appendChild(b)})}
function saveHistory(){if(!messages.length)return;const first=messages.find(x=>x.role==="user");if(!first)return;const item={title:first.content.slice(0,48),messages};saved.push(item);localStorage.setItem("dmvjy-history",JSON.stringify(saved.slice(-12)));renderHistory()}
function loadConversation(item){messages=item.messages.map(x=>({...x}));render();$("sidebar").classList.remove("open")}
function render(){messagesEl.innerHTML="";welcome.style.display=messages.length?"none":"";messages.forEach(m=>addMessage(m.role,m.content))}
function addMessage(role,text){const row=document.createElement("div");row.className="message "+role;if(role==="assistant"){const a=document.createElement("div");a.className="avatar";a.textContent="💎";row.appendChild(a)}const b=document.createElement("div");b.className="bubble";b.textContent=text;row.appendChild(b);messagesEl.appendChild(row);messagesEl.scrollIntoView({block:"end",behavior:"smooth"})}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,180)+"px";send.disabled=!input.value.trim()||busy}
async function ask(){const text=input.value.trim();if(!text||busy)return;busy=true;resize();input.value="";resize();if(!messages.length)welcome.style.display="none";messages.push({role:"user",content:text});addMessage("user",text);const typing=document.createElement("div");typing.className="message assistant";typing.innerHTML='<div class="avatar">💎</div><div class="bubble typing">Pensando…</div>';messagesEl.appendChild(typing);$("status").textContent="Pensando…";
try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,stream:false})});const data=await r.json();typing.remove();if(!r.ok)throw new Error(data.error||"No se pudo obtener una respuesta.");const answer=String(data.answer||"").trim();if(!answer)throw new Error("DMVJY no devolvió una respuesta.");messages.push({role:"assistant",content:answer});addMessage("assistant",answer);saveHistory();$("status").textContent="IA educativa"}
catch(e){typing.remove();addMessage("assistant","No pude responder en este momento. "+(e.message||"Inténtalo de nuevo."));$("status").textContent="Servicio no disponible"}
finally{busy=false;resize();input.focus()}}
$("send").onclick=ask;
input.addEventListener("input",resize);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.textContent;resize();input.focus()});
$("newChat").onclick=()=>{messages=[];render();input.value="";resize();$("status").textContent="IA educativa";input.focus()};
$("menu").onclick=()=>$("sidebar").classList.toggle("open");
renderHistory();resize();
</script>
</body>
</html>
