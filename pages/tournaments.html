<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Torneos | TecnoMath</title><script src="../js/tecnomath-auth.js"></script><style>body{margin:0;background:#080912;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#111426;border:1px solid #292e49;border-radius:18px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#272d49;font-size:12px}.live{background:#4b1721;color:#ff9baa}.open{background:#163c27;color:#7dff9b}.finished{color:#aaa}.meta{color:#a9afc5;line-height:1.7}.btn{display:inline-block;padding:11px 15px;border-radius:10px;background:#39ff14;color:#001;font-weight:900;text-decoration:none}.empty{text-align:center;color:#a9afc5;padding:35px}.prize{font-weight:900}@media(max-width:650px){.wrap{padding:14px}}</style>    <script src="/js/i18n.js" defer></script>
</head><body><main class="wrap"><a href="../index.html">← TecnoMath</a><section class="hero"><h1>🏆 Torneos TecnoMath</h1><p>Compite con otros estudiantes, consigue la mayor puntuación y lucha por el podio.</p><div id="account" class="meta">Comprobando sesión…</div></section><h2>🔥 Torneos disponibles</h2><div id="list" class="grid"><div class="empty">Cargando…</div></div></main><script>(async()=>{const db=await TecnomathAuth.getClient(),$=id=>document.getElementById(id);try{const u=await TecnomathAuth.currentUser();$('account').textContent=u?'🟢 Sesión iniciada. Puedes inscribirte.':'🔵 Puedes consultar torneos. Inicia sesión para competir.';await load();setInterval(load,15000)}catch(e){$('list').innerHTML='<div class="empty">No se pudieron cargar los torneos.</div>'}async function load(){const {data,error}=await db.from('tecnomath_tournaments').select('*').in('status',['open','live','finished']).order('start_at',{ascending:false});if(error)throw error;if(!data?.length){$('list').innerHTML='<div class="empty">No hay torneos todavía.</div>';return}$('list').innerHTML=data.map(t=>`<article class="card"><span class="badge ${t.status}">${label(t.status)}</span><h2>${esc(t.name)}</h2><p class="meta">🎮 ${esc(t.game_id)}<br>📅 ${fmt(t.start_at)}<br>🏁 ${fmt(t.end_at)}<br>👥 Máximo ${t.max_players}</p><p>${esc(t.description||'')}</p><p class="prize">🥇 $${Number(t.prize_first_cop).toLocaleString('es-CO')} · 🥈 $${Number(t.prize_second_cop).toLocaleString('es-CO')} · 🥉 $${Number(t.prize_third_cop).toLocaleString('es-CO')} COP</p><a class="btn" href="tournament.html?id=${encodeURIComponent(t.id)}">Ver torneo</a></article>`).join('')}function label(s){return ({open:'🟢 INSCRIPCIONES ABIERTAS',live:'🔴 EN VIVO',finished:'🏁 FINALIZADO'})[s]||s}function fmt(x){return new Date(x).toLocaleString('es-CO')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})()</script></body></html>
