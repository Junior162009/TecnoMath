<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Torneo | TecnoMath</title><script src="../js/tecnomath-auth.js"></script><style>body{margin:0;background:#080912;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.box{background:#111426;border:1px solid #292e49;border-radius:18px;padding:22px;margin:16px 0}.top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#272d49}.live{background:#4b1721;color:#ff9baa}.open{background:#163c27;color:#7dff9b}.btn{border:0;border-radius:10px;padding:12px 16px;background:#39ff14;color:#001;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn:disabled{opacity:.5}.msg{padding:12px;border-radius:10px;background:#0b0e19}.error{color:#ff7788}.ok{color:#7dff9b}.meta{color:#a9afc5;line-height:1.8}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:12px;border-bottom:1px solid #292e49;text-align:left}.me{font-weight:900}.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.prize{text-align:center;background:#171b2b;border-radius:12px;padding:15px;font-weight:900}@media(max-width:650px){.wrap{padding:14px}.prizes{grid-template-columns:1fr}}
</style>    <script src="/js/i18n.js" defer></script>
</head><body><main class="wrap"><a href="tournaments.html">← Torneos</a><div id="app" class="box">Cargando torneo…</div></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);if(!id){$('app').textContent='Falta el torneo.';return}const db=await TecnomathAuth.getClient();let me=null,t=null;try{me=await TecnomathAuth.currentUser();await load();const ch=db.channel('tm-v2-'+id).on('postgres_changes',{event:'*',schema:'public',table:'tecnomath_tournament_participants',filter:'tournament_id=eq.'+id},refresh).on('postgres_changes',{event:'*',schema:'public',table:'tecnomath_tournament_results',filter:'tournament_id=eq.'+id},load).subscribe();window.addEventListener('beforeunload',()=>db.removeChannel(ch));setInterval(load,15000)}catch(e){console.error(e);$('app').innerHTML='<span class="error">No se pudo cargar el torneo.</span>'}async function load(){const {error}=await db.rpc('tecnomath_tournament_sync_status',{p_tournament_id:id});if(error)throw error;const r=await db.from('tecnomath_tournaments').select('*').eq('id',id).single();if(r.error)throw r.error;t=r.data;render();await refresh()}function render(){const canJoin=!!me&&['open','live'].includes(t.status);const canPlay=!!me&&t.status==='live';$('app').innerHTML=`<div class="top"><div><span class="badge ${t.status==='live'?'live':t.status==='open'?'open':''}">${label(t.status)}</span><h1>🏆 ${esc(t.name)}</h1><p>${esc(t.description||'')}</p><div class="meta">🎮 ${esc(t.game_id)}<br>📅 ${fmt(t.start_at)}<br>🏁 ${fmt(t.end_at)}<br>👥 Máximo ${t.max_players}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px">${canJoin?'<button id="join" class="btn">🏁 INSCRIBIRME</button>':''}${canPlay?`<a class="btn" href="tournament-play.html?id=${encodeURIComponent(t.id)}&game=${encodeURIComponent(t.game_id)}">🎮 JUGAR TORNEO</a>`:''}</div><div id="msg" class="msg" style="margin-top:12px">${me?'Tu cuenta está lista para competir.':'Inicia sesión para inscribirte y jugar.'}</div></div></div><h2>📊 Ranking en vivo</h2><div id="ranking">Cargando…</div><h2>💰 Premios</h2><div class="prizes"><div class="prize">🥇<br>$${Number(t.prize_first_cop).toLocaleString('es-CO')} COP</div><div class="prize">🥈<br>$${Number(t.prize_second_cop).toLocaleString('es-CO')} COP</div><div class="prize">🥉<br>$${Number(t.prize_third_cop).toLocaleString('es-CO')} COP</div></div>`;const b=$('join');if(b)b.onclick=join}async function join(){const b=$('join');b.disabled=true;const {error}=await db.rpc('tecnomath_tournament_join',{p_tournament_id:id});if(error){$('msg').innerHTML='<span class="error">❌ '+esc(friendly(error))+'</span>'}else{$('msg').innerHTML='<span class="ok">✅ Inscripción confirmada. '+(t.status==='live'?'Ya puedes jugar.':'Espera a que comience.')+'</span>';await load()}}async function refresh(){const {data,error}=await db.from('tecnomath_tournament_participants').select('id,user_id,display_name,best_score,attempts').eq('tournament_id',id).order('best_score',{ascending:false}).order('last_played_at',{ascending:true,nullsFirst:true}).order('joined_at',{ascending:true});if(error)throw error;const rows=data||[];$('ranking').innerHTML=rows.length?`<table class="rank"><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Intentos</th></tr></thead><tbody>${rows.map((p,i)=>`<tr class="${me&&p.user_id===me.id?'me':''}"><td>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</td><td>${esc(p.display_name)}</td><td>${Number(p.best_score).toLocaleString('es-CO')}</td><td>${p.attempts}</td></tr>`).join('')}</tbody></table>`:'<div class="msg">Todavía no hay participantes.</div>'}function label(s){return ({open:'🟢 INSCRIPCIONES ABIERTAS',live:'🔴 EN VIVO',finished:'🏁 FINALIZADO',cancelled:'❌ CANCELADO',draft:'📝 BORRADOR'})[s]||s}function fmt(x){return new Date(x).toLocaleString('es-CO')}function friendly(e){const m=String(e?.message||e);return m.includes('tournament_full')?'El torneo está lleno.':m.includes('registration_closed')?'Las inscripciones están cerradas.':m.includes('login_required')?'Debes iniciar sesión.':m}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})()</script></body></html>
