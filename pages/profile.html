<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>Tecnomath · Perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>:root{--cyan:#00ffff;--pink:#ff00ff;--bg:#060610;--card:#0d0d1a;--green:#39ff14}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 12px;background:radial-gradient(ellipse at 25% 15%,rgba(0,255,255,.14),transparent 48%),radial-gradient(ellipse at 85% 85%,rgba(255,0,255,.09),transparent 42%),var(--bg);color:#fff;font-family:'Press Start 2P',cursive}.card{width:min(100%,450px);padding:clamp(22px,5vw,32px);border:2px solid var(--cyan);border-radius:16px;background:var(--card);box-shadow:0 0 20px rgba(0,255,255,.3),0 22px 70px rgba(0,0,0,.42)}h1{margin:0 0 22px;color:var(--cyan);font-size:14px;text-align:center;letter-spacing:1px;text-shadow:0 0 12px rgba(0,255,255,.7)}label{display:block;margin:20px 0 7px;font-size:7px;color:#aefefe}input{width:100%;padding:13px 12px;border:2px solid #333;border-radius:8px;outline:none;color:var(--cyan);background:#0a0a1a;font:8px 'Press Start 2P',cursive}input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,0,255,.12)}button{width:100%;margin-top:10px;padding:13px 12px;border:0;border-radius:8px;color:#fff;background:var(--pink);box-shadow:0 0 10px var(--pink);cursor:pointer;font:8px 'Press Start 2P',cursive}button.secondary{border:1px solid var(--cyan);color:var(--cyan);background:transparent;box-shadow:none;margin-top:22px}button:disabled{opacity:.55;cursor:wait}.message{min-height:20px;margin-top:14px;color:var(--pink);font-size:7px;line-height:1.8;text-align:center}.back{display:block;margin-top:20px;color:#aaa;font-size:6px;text-align:center;text-decoration:none}.hint{color:#aaa;font-size:6px;line-height:1.8;margin:8px 0 0}</style>    <script src="/js/i18n.js" defer></script>
</head>
<body><main class="card"><h1>👤 MI PERFIL</h1><label for="username">USUARIO ÚNICO</label><input id="username" autocomplete="username" maxlength="20"><button id="saveUsername">GUARDAR USUARIO</button><label for="email">CORREO</label><input id="email" type="email" autocomplete="email"><p class="hint">Al cambiarlo recibirás un enlace de verificación.</p><button id="saveEmail">CAMBIAR CORREO</button><label for="password">NUEVA CONTRASEÑA</label><input id="password" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"><button id="savePassword">CAMBIAR CONTRASEÑA</button><button id="logout" class="secondary">🚪 CERRAR SESIÓN</button><div id="message" class="message" role="status"></div><a class="back" href="../index.html">← VOLVER AL PORTAL</a></main>
<script src="../js/tecnomath-auth.js?v=20260911-3"></script><script>
const usernameEl=document.getElementById('username'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),messageEl=document.getElementById('message');let currentUser=null,currentProfile=null;
const msg=(t,c='#ff00ff')=>{messageEl.textContent=t;messageEl.style.color=c};const busy=(b,x,t)=>{b.disabled=x;b.textContent=x?'GUARDANDO…':t};const valid=u=>/^[a-zA-Z0-9._-]{3,20}$/.test(u.trim());
async function boot(){try{const u=await TecnomathAuth.currentUser();if(!u){location.replace('auth.html');return}currentUser=u;currentProfile=await TecnomathAuth.ensureProfile(u);usernameEl.value=currentProfile?.username||'';emailEl.value=u.email||''}catch(e){msg(e.message||'No pudimos cargar tu perfil.')}}
document.getElementById('saveUsername').onclick=async function(){if(!currentUser)return;const next=usernameEl.value.trim();if(!valid(next)){msg('El usuario debe tener 3 a 20 caracteres: letras, números, punto, guion o guion bajo.');return}if(next===currentProfile?.username){msg('Ese ya es tu usuario actual.','#39ff14');return}busy(this,true,'GUARDAR USUARIO');try{const db=await TecnomathAuth.getClient();const {data:exists,error:check}=await db.from('tecnomath_profiles').select('id').ilike('username',next).neq('id',currentUser.id).limit(1);if(check)throw check;if(exists?.length)throw new Error('Ese nombre de usuario ya está ocupado.');const {data,error}=await db.from('tecnomath_profiles').update({username:next,display_name:next}).eq('id',currentUser.id).select().single();if(error)throw error;currentProfile=data;TecnomathAuth.setSession(next);msg('Usuario actualizado.','#39ff14')}catch(e){msg(e.message||'No se pudo cambiar el usuario.')}finally{busy(this,false,'GUARDAR USUARIO')}};
document.getElementById('saveEmail').onclick=async function(){if(!currentUser)return;const next=emailEl.value.trim();if(!next){msg('Escribe un correo válido.');return}busy(this,true,'CAMBIAR CORREO');try{await TecnomathAuth.updateEmail(next);msg('Solicitud enviada. Revisa tu correo para confirmar el cambio.','#39ff14')}catch(e){msg(e.message||'No se pudo cambiar el correo.')}finally{busy(this,false,'CAMBIAR CORREO')}};
document.getElementById('savePassword').onclick=async function(){if(!currentUser)return;const p=passwordEl.value;if(p.length<6){msg('La contraseña debe tener al menos 6 caracteres.');return}busy(this,true,'CAMBIAR CONTRASEÑA');try{await TecnomathAuth.updatePassword(p);passwordEl.value='';msg('Contraseña actualizada.','#39ff14')}catch(e){msg(e.message||'No se pudo cambiar la contraseña.')}finally{busy(this,false,'CAMBIAR CONTRASEÑA')}};
document.getElementById('logout').onclick=async()=>{try{await TecnomathAuth.signOut()}finally{location.replace('../index.html')}};boot();
</script></body></html>
