<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orden de votaciones · TecnoMath</title><link rel="stylesheet" href="../../css/admin.css">
<script src="../../js/tecnomath-auth.js?v=20260920"></script><script src="../../js/admin-guard.js?v=20260920"></script>
<style>
:root{--bg:#080812;--panel:#101020;--line:#30304b;--cyan:#00e5ff;--muted:#a9acc2}body{background:var(--bg);color:#f7f7ff}.wrap{max-width:1000px;margin:auto;padding:20px}.panel,.intro{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.muted,small{color:var(--muted)}.back{color:var(--cyan);text-decoration:none}.notice{padding:12px;border-radius:10px;background:#17172b;margin:12px 0}.notice.error{border:1px solid #a33e58}.notice.success{border:1px solid #27794b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:200px;background:#090916;color:white;border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:1px solid var(--line);background:#17172c;color:white;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.btn.primary{background:#073d48;border-color:#08798b}.btn:disabled{opacity:.4;cursor:not-allowed}.list{display:grid;gap:8px}.item{display:flex;align-items:center;gap:12px;padding:12px;background:#0b0b18;border:1px solid var(--line);border-radius:12px}.pos{min-width:36px;text-align:center;font-weight:900;color:var(--cyan)}.name{flex:1;min-width:0}.name strong{display:block;overflow-wrap:anywhere}.name small{display:block}.actions{display:flex;gap:5px;flex-wrap:wrap}.status{font-size:12px;color:var(--muted)}@media(max-width:600px){.wrap{padding:10px}.item{align-items:flex-start;flex-wrap:wrap}.name{min-width:65%}.actions{width:100%;padding-left:48px}.actions .btn{flex:1}}
</style>    <script src="/js/i18n.js" defer></script>
</head>
<body><header class="topbar"><div><strong>⚡ TECNOMATH</strong><span> · Administración</span></div><button id="logout" type="button">Cerrar sesión</button></header>
<main class="wrap"><section class="intro"><a class="back" href="./index.html">← Volver al panel</a><h1>🗳️ Orden manual de votaciones</h1><p class="muted">El orden guardado se aplica a las tarjetas de votación. Los juegos nuevos se agregan al final. Este ajuste no modifica calificaciones ni visibilidad.</p></section>
<div id="notice" class="notice" role="status">Verificando permisos…</div><section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="Buscar juego por nombre…"><button class="btn" id="reload">↻ Recargar catálogo</button><button class="btn primary" id="save">☁️ Guardar orden</button></div><p class="status" id="summary">Cargando juegos…</p><div id="list" class="list"></div></section></main>
<script>
(function(){'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const state={db:null,games:[],order:[],busy:false};function notice(t,k=''){ $('notice').textContent=t;$('notice').className='notice '+k}
function id(g){return String(g.url||g.name||g.id||'').trim()}function display(g){return String(g.name||g.title||g.nombre||'Juego sin nombre').trim()}
function normalize(){const seen=new Set();state.games=state.games.filter(g=>{const k=id(g);if(!k||seen.has(k))return false;seen.add(k);return true});const valid=new Set(state.games.map(id));state.order=state.order.filter(k=>valid.has(k));for(const g of state.games){const k=id(g);if(!state.order.includes(k))state.order.push(k)}}
function render(){const q=$('search').value.trim().toLocaleLowerCase('es');const rows=state.order.map(k=>state.games.find(g=>id(g)===k)).filter(g=>g&&(!q||display(g).toLocaleLowerCase('es').includes(q)));$('summary').textContent=state.games.length+' juegos detectados · '+state.order.length+' posiciones. Usa los controles para definir el orden.';$('list').innerHTML=rows.length?rows.map(g=>{const k=id(g),i=state.order.indexOf(k);return '<div class="item"><span class="pos">#'+(i+1)+'</span><div class="name"><strong>'+esc(display(g))+'</strong><small>'+esc(g.status==='published'?'Publicado':'Estado: '+(g.status||'sin indicar'))+'</small></div><div class="actions"><button class="btn" data-act="top" data-id="'+esc(k)+'" '+(i===0?'disabled':'')+'>⤒ Principio</button><button class="btn" data-act="up" data-id="'+esc(k)+'" '+(i===0?'disabled':'')+'>↑ Subir</button><button class="btn" data-act="down" data-id="'+esc(k)+'" '+(i===state.order.length-1?'disabled':'')+'>↓ Bajar</button><button class="btn" data-act="end" data-id="'+esc(k)+'" '+(i===state.order.length-1?'disabled':'')+'>⤓ Final</button></div></div>'}).join(''):'<p class="muted">No hay juegos que coincidan con la búsqueda.</p>'}
async function load(){if(state.busy)return;state.busy=true;$('reload').disabled=true;try{const r=await fetch('../../data/games.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No se pudo leer el catálogo oficial.');const data=await r.json();if(!Array.isArray(data))throw Error('El catálogo no tiene el formato esperado.');state.games=data.filter(g=>g&&g.name&&g.url&&g.status==='published'&&g.allowVoting!==false&&!g.evento);const v=await state.db.rpc('tecnomath_get_setting',{p_key:'voting_game_order'});if(v.error)throw v.error;let saved=v.data;if(typeof saved==='string'){try{saved=JSON.parse(saved)}catch{saved=[]}}state.order=Array.isArray(saved)?saved.map(String):[];normalize();render();notice('Catálogo cargado. Los juegos nuevos aparecen al final hasta que guardes el orden.','success')}catch(e){console.error(e);notice('Error al cargar el catálogo o el orden: '+(e.message||e),'error')}finally{state.busy=false;$('reload').disabled=false}}
async function save(){if(state.busy)return;state.busy=true;$('save').disabled=true;try{normalize();const r=await state.db.rpc('tecnomath_admin_save_setting',{p_key:'voting_game_order',p_value:state.order});if(r.error)throw r.error;notice('Orden guardado en Supabase. Recarga la página de votaciones para comprobarlo.','success')}catch(e){console.error(e);notice('No se pudo guardar el orden: '+(e.message||e),'error')}finally{state.busy=false;$('save').disabled=false}}
function move(k,act){const i=state.order.indexOf(k);if(i<0)return;state.order.splice(i,1);if(act==='top')state.order.unshift(k);else if(act==='end')state.order.push(k);else if(act==='up')state.order.splice(Math.max(0,i-1),0,k);else if(act==='down')state.order.splice(Math.min(state.order.length,i+1),0,k);render()}
async function boot(){try{const ready=await window.TecnomathAdminGuard.requireAdmin({redirect:true});state.db=await window.TecnomathAuth.getClient();$('logout').onclick=async()=>{try{await window.TecnomathAuth.signOut()}finally{location.href='../../index.html'}};$('reload').onclick=load;$('save').onclick=save;$('search').oninput=render;$('list').onclick=e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)move(b.dataset.id,b.dataset.act)};await load()}catch(e){console.error(e);notice('No se pudo verificar el acceso administrativo: '+(e.message||e),'error')}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot()})();
</script></body></html>
