<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usuarios · TecnoMath</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070d;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:22px}.brand span{color:#39ff14}.back,.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #292943;border-radius:10px;padding:10px 14px;background:#111126;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.btn.primary{background:#39ff14;color:#001;border-color:#39ff14}.hero{margin:28px 0}.eyebrow{color:#39ff14;font-weight:800;letter-spacing:.12em;font-size:12px}.hero h1{margin:6px 0;font-size:clamp(30px,5vw,48px)}.hero p{color:#aaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:18px;border:1px solid #292943;border-radius:14px;background:#0d0d18}.stat span{display:block;color:#aaa;font-size:13px}.stat b{display:block;font-size:30px;margin-top:5px}.panel{border:1px solid #292943;border-radius:16px;background:#0d0d18;padding:18px}.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:200px;background:#080811;color:#fff;border:1px solid #292943;border-radius:10px;padding:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:13px;border-bottom:1px solid #202034}th{color:#aaa;font-size:12px;text-transform:uppercase}td{font-size:14px}.badge{display:inline-block;padding:5px 9px;border-radius:8px;font-size:11px;font-weight:900}.badge.admin{background:#233b24;color:#39ff14}.badge.user{background:#252538;color:#aaa}.provider{font-size:12px;color:#aaa}.empty{text-align:center;color:#aaa;padding:30px}.msg{margin:14px 0;padding:12px;border-radius:10px;display:none}.msg.show{display:block;background:#18182a}.msg.error{background:#351722;color:#ff9db0}.loading{opacity:.7}@media(max-width:700px){main{padding:18px}.stats{grid-template-columns:1fr}}
</style>
    <script src="/js/i18n.js" defer></script>
</head>
<body>
<main>
<div class="top"><div class="brand">⚡ <span>TECNOMATH</span> · Usuarios</div><div><a class="back" href="./index.html">← Panel principal</a> <button class="btn primary" id="refresh">↻ Actualizar</button></div></div>
<section class="hero"><div class="eyebrow">ADMINISTRACIÓN</div><h1>Usuarios registrados</h1><p>Consulta las cuentas creadas en Supabase Auth y sus perfiles de TecnoMath.</p></section>
<div id="msg" class="msg"></div>
<section class="stats"><div class="stat"><span>Usuarios registrados</span><b id="total">—</b></div><div class="stat"><span>Administradores</span><b id="admins">—</b></div><div class="stat"><span>Usuarios normales</span><b id="normal">—</b></div></section>
<section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="Buscar por usuario, nombre o correo…"><select id="role"><option value="all">Todos los roles</option><option value="admin">Administradores</option><option value="user">Usuarios</option></select></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Nombre</th><th>Correo</th><th>Proveedor</th><th>Rol</th><th>Creado</th><th>Último inicio</th></tr></thead><tbody id="body"><tr><td colspan="7" class="loading">Cargando usuarios…</td></tr></tbody></table></div></section>
</main>
<script src="../../js/tecnomath-auth.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let rows=[];
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function date(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'})}
function msg(text,error=false){$('msg').textContent=text;$('msg').className='msg show'+(error?' error':'')}
function render(){const q=$('search').value.trim().toLowerCase(),r=$('role').value;const f=rows.filter(x=>(!q||`${x.username||''} ${x.display_name||''} ${x.email||''}`.toLowerCase().includes(q))&&(r==='all'||String(x.role||'user')===r));$('total').textContent=rows.length;$('admins').textContent=rows.filter(x=>x.role==='admin').length;$('normal').textContent=rows.filter(x=>x.role!=='admin').length;$('body').innerHTML=f.length?f.map(x=>`<tr><td><strong>${esc(x.username||'Sin usuario')}</strong></td><td>${esc(x.display_name||'—')}</td><td>${esc(x.email||'—')}</td><td><span class="provider">${esc(x.provider||'email')}</span></td><td><span class="badge ${x.role==='admin'?'admin':'user'}">${x.role==='admin'?'ADMIN':'USUARIO'}</span></td><td>${date(x.created_at)}</td><td>${date(x.last_sign_in_at)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">No hay usuarios que coincidan.</td></tr>'}
async function load(){try{$('body').innerHTML='<tr><td colspan="7" class="loading">Cargando usuarios desde Supabase Auth…</td></tr>';const u=await TecnomathAuth.currentUser();if(!u){location.href='../auth.html';return}const p=await TecnomathAuth.getProfile(u);if(!p||p.role!=='admin'){msg('No tienes permisos de administrador.',true);setTimeout(()=>location.href='../../index.html',1800);return}const db=await TecnomathAuth.getClient();const {data,error}=await db.functions.invoke('admin-list-users');if(error)throw error;if(!data||data.error)throw new Error(data?.error||'No se pudieron consultar los usuarios.');rows=data.users||[];render();msg(`Se cargaron ${rows.length} usuarios desde Supabase Auth.`)}catch(e){console.error(e);$('body').innerHTML='<tr><td colspan="7" class="empty">No se pudieron cargar los usuarios.</td></tr>';msg(e.message||'No se pudieron cargar los usuarios.',true)}}
$('refresh').onclick=load;$('search').oninput=render;$('role').onchange=render;load();
</script>
</body>
</html>
