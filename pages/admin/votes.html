<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Admin · Votaciones · TecnoMath</title><link rel="stylesheet" href="../../css/voting.css?v=20260918-v2"><script src="../../js/tecnomath-auth.js?v=20260918-voting"></script>    <script src="/js/i18n.js" defer></script>
</head><body><main class="voting-shell"><header class="hero"><a class="brand" href="./index.html">← ADMIN · TECNOMATH</a><div class="hero-copy"><span class="eyebrow">CENTRO DE CONTROL</span><h1>🏆 VOTACIONES</h1><p>Resultados, actividad, exportación y reportes.</p></div><div class="live-badge" id="liveStatus"><i></i> COMPROBANDO…</div></header><section class="stats-grid"><article class="stat-card"><span>🎮 Juegos</span><strong id="totalGames">—</strong></article><article class="stat-card"><span>❤️ Votos</span><strong id="totalVotes">—</strong></article><article class="stat-card"><span>👑 Líder</span><strong id="leaderName">—</strong></article><article class="stat-card"><span>🕒 Último voto</span><strong id="lastVote">—</strong></article></section><div class="toolbar"><button id="refreshBtn" class="ghost-btn">↻ Actualizar</button><button id="reportBtn" class="vote-btn">📧 ENVIAR REPORTE</button><button id="csvBtn" class="ghost-btn">📥 EXPORTAR CSV</button><a class="ghost-btn" href="../voting.html">👁️ Ver votación</a></div><section class="ranking-panel"><div class="section-head"><div><span class="eyebrow">ADMIN</span><h2>🏆 RANKING</h2></div><span class="small-status" id="rankStatus">—</span></div><div id="rankingList"></div></section><section class="ranking-panel"><div class="section-head"><div><span class="eyebrow">ACTIVIDAD</span><h2>🕒 VOTOS RECIENTES</h2></div></div><div id="recentList" class="ranking-list"></div></section><div id="toastRegion" class="toast-region"></div></main><script>
(async()=>{const $=id=>document.getElementById(id);let db,games=[],rows=[],channel;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('es-CO');const toast=(a,b)=>{const d=document.createElement('div');d.className='toast';d.innerHTML='<strong>'+esc(a)+'</strong><span>'+esc(b)+'</span>';$('toastRegion').appendChild(d);setTimeout(()=>d.remove(),4000)};async function load(){games=await (await fetch('../../data/games.json?v='+Date.now(),{cache:'no-store'})).json();const r=await db.from('game_vote_counts').select('game_id,votes');if(r.error)throw r.error;const map=new Map((r.data||[]).map(x=>[String(x.game_id),Number(x.votes||0)]));rows=games.filter(g=>g?.name&&g?.url).map(g=>({...g,id:String(g.url||g.name),votes:Number(map.get(String(g.url||g.name))||0)})).sort((a,b)=>b.votes-a.votes||a.name.localeCompare(b.name,'es'));render()}function render(){$('totalGames').textContent=money(rows.length);$('totalVotes').textContent=money(rows.reduce((a,b)=>a+b.votes,0));$('leaderName').textContent=rows[0]?.name||'—';$('rankStatus').textContent='En vivo';$('rankingList').innerHTML=rows.map((g,i)=>'<div class="rank-row"><div class="rank-pos">'+(i<3?['🥇','🥈','🥉'][i]:'#'+(i+1))+'</div><div class="rank-info"><strong>'+esc(g.name)+'</strong><small>'+esc(g.category||'otros')+'</small></div><div class="rank-votes">'+money(g.votes)+'</div></div>').join('')}async function recent(){const r=await db.functions.invoke('send-voting-report',{body:{action:'data'}});if(r.error)throw r.error;if(!r.data?.ok)throw Error(r.data?.error||'No se pudieron consultar los votos recientes.');const v=r.data.recent_votes||[];$('lastVote').textContent=v[0]?new Date(v[0].created_at).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}):'—';$('recentList').innerHTML=v.length?v.slice(0,20).map(x=>'<div class="rank-row"><div class="rank-pos">#'+esc(x.id)+'</div><div class="rank-info"><strong>'+esc(x.voter_name)+' · '+esc(x.grade)+'</strong><small>'+esc(x.game_id)+' · '+new Date(x.created_at).toLocaleString('es-CO')+'</small></div><div class="rank-votes">VOTO</div></div>').join(''):'<div class="empty">No hay votos recientes.</div>'}async function csv(){const b=$('csvBtn');b.disabled=true;try{const r=await db.functions.invoke('send-voting-report',{body:{action:'csv'}});if(r.error)throw r.error;if(!r.data?.ok)throw Error(r.data?.error||'No se pudieron obtener los votos.');const gameNames=new Map(games.map(g=>[String(g.url||g.name),g.name]));const votes=r.data.votes||[],lines=['id,nombre,grado,game_id,juego,fecha'];votes.forEach(v=>lines.push([v.id,v.voter_name,v.grade,v.game_id,gameNames.get(String(v.game_id))||v.game_id,v.created_at].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')));const blob=new Blob(['\\ufeff'+lines.join('\\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tecnomath-votos.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('📥 CSV generado','Se exportaron '+votes.length+' votos con ID, nombre, grado y juego.')}catch(e){console.error(e);toast('⚠️ Error','No se pudo exportar el CSV.')}finally{b.disabled=false}}async function report(){const b=$('reportBtn');b.disabled=true;try{const r=await db.functions.invoke('send-voting-report',{body:{action:'send'}});if(r.error)throw r.error;if(!r.data?.ok)throw Error(r.data?.error||'No se pudo enviar el reporte.');toast('📧 Reporte enviado','El resumen fue enviado por Resend.')}catch(e){console.error(e);toast('⚠️ No se envió','Revisa la configuración de Resend.')}finally{b.disabled=false}}async function refresh(){await load();await recent()}async function boot(){try{const u=await TecnomathAuth.currentUser();if(!u){location.replace('../auth.html');return}const p=await TecnomathAuth.getProfile(u);if(p?.role!=='admin'){document.body.innerHTML='<main class="voting-shell"><div class="empty">⛔ No tienes permisos de administrador.</div></main>';return}db=await TecnomathAuth.getClient();await refresh();channel=db.channel('tecnomath-voting').on('broadcast',{event:'VOTE',callback:async()=>{await refresh()}}).subscribe(s=>{$('liveStatus').innerHTML='<i></i> '+(s==='SUBSCRIBED'?'VOTACIONES EN VIVO':'RECONECTANDO…')});$('refreshBtn').onclick=refresh;$('reportBtn').onclick=report;$('csvBtn').onclick=csv;window.addEventListener('beforeunload',()=>db.removeChannel(channel))}catch(e){console.error(e);toast('⚠️ Error','No se pudo cargar el panel.')}}boot()})()
</script></body></html>
