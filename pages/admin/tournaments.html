<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Torneos | Administración | TecnoMath</title><script src="../../js/tecnomath-auth.js"></script><style>body{margin:0;background:#080912;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:24px}.box,.card{background:#111426;border:1px solid #292e49;border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:grid;gap:7px;font-weight:700}input,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #3b4160;background:#080912;color:#fff}button,.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#39ff14;color:#001}.secondary{background:#303750;color:#fff}.danger{background:#ff496c;color:#fff}.ok{color:#78ff9b}.error{color:#ff7788}.muted{color:#a9afc5}.tools{display:flex;gap:9px;flex-wrap:wrap}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#272d49;font-size:12px}.card h3{margin:9px 0}.money{font-weight:900}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.payout{padding:10px;border-radius:10px;background:#0b0e19;margin-top:8px}@media(max-width:650px){.wrap{padding:14px}}
</style>    <script src="/js/i18n.js" defer></script>
</head>
<body><main class="wrap"><a href="index.html">← Panel principal</a><h1>🏆 Centro de torneos</h1><div id="access" class="box">Comprobando administrador…</div><section id="panel" hidden><div class="box"><h2>Crear torneo</h2><form id="form"><div class="grid"><label>Nombre<input id="name" required maxlength="120" placeholder="Copa TecnoMath"></label><label>ID del juego<input id="game" required maxlength="120" placeholder="mindmath"></label><label>Máximo de jugadores<input id="max" type="number" min="2" max="5000" value="32"></label><label>Inicio<input id="start" type="datetime-local" required></label><label>Final<input id="end" type="datetime-local" required></label><label>🥇 Premio COP<input id="p1" type="number" min="0" value="0"></label><label>🥈 Premio COP<input id="p2" type="number" min="0" value="0"></label><label>🥉 Premio COP<input id="p3" type="number" min="0" value="0"></label><label style="grid-column:1/-1">Descripción<textarea id="description" maxlength="1000" placeholder="Reglas y condiciones del torneo"></textarea></label></div><p class="muted">El torneo se abre para inscripciones y pasa automáticamente a EN VIVO al llegar la hora de inicio. Los premios se registran en COP y el pago se marca manualmente desde este panel.</p><button class="primary">🏆 Crear torneo</button></form><div id="msg"></div></div><h2>Mis torneos</h2><div id="list">Cargando…</div></section></main><script>(async()=>{const $=id=>document.getElementById(id);let db;try{if(!await TecnomathAuth.isAdmin()){throw new Error('No tienes permisos de administrador.')}db=await TecnomathAuth.getClient();$('access').innerHTML='<span class="ok">🟢 Administrador reconocido.</span>';$('panel').hidden=false;await load();$('form').onsubmit=create}catch(e){$('access').innerHTML='<span class="error">⛔ '+esc(e.message||e)+'</span>'}async function create(ev){ev.preventDefault();const msg=$('msg');try{const a=new Date($('start').value),b=new Date($('end').value);const vals=[+$('p1').value,+$('p2').value,+$('p3').value];if(b<=a)throw Error('La fecha final debe ser posterior al inicio.');if(vals[0]<vals[1]||vals[1]<vals[2])throw Error('Los premios deben ir de mayor a menor.');const {error}=await db.rpc('tecnomath_tournament_create',{p_name:$('name').value,p_game_id:$('game').value,p_description:$('description').value,p_max_players:+$('max').value,p_start_at:a.toISOString(),p_end_at:b.toISOString(),p_prize_first_cop:vals[0],p_prize_second_cop:vals[1],p_prize_third_cop:vals[2]});if(error)throw error;msg.innerHTML='<p class="ok">✅ Torneo creado.</p>';$('form').reset();$('max').value=32;await load()}catch(e){msg.innerHTML='<p class="error">❌ '+esc(e.message||e)+'</p>'}}async function load(){const {data,error}=await db.from('tecnomath_tournaments').select('*').order('start_at',{ascending:true});if(error)throw error;if(!data?.length){$('list').innerHTML='<div class="box muted">No hay torneos.</div>';return}const ids=data.map(x=>x.id);const {data:parts}=await db.from('tecnomath_tournament_participants').select('tournament_id,user_id,display_name,best_score,attempts').in('tournament_id',ids).order('best_score',{ascending:false});const {data:payouts}=await db.from('tecnomath_tournament_payouts').select('*').in('tournament_id',ids);$('list').innerHTML=data.map(t=>{const ps=(parts||[]).filter(p=>p.tournament_id===t.id),pay=(payouts||[]).filter(p=>p.tournament_id===t.id);return `<article class="card"><span class="badge">${label(t.status)}</span><h3>🏆 ${esc(t.name)}</h3><div class="muted">🎮 ${esc(t.game_id)} · 👥 ${ps.length}/${t.max_players}<br>📅 ${fmt(t.start_at)} → ${fmt(t.end_at)}<br>💰 Premios: ${money(t.prize_first_cop)} / ${money(t.prize_second_cop)} / ${money(t.prize_third_cop)}</div><div class="tools" style="margin-top:12px"><a class="btn secondary" href="../tournament.html?id=${t.id}">Ver torneo</a>${t.status!=='finished'&&t.status!=='cancelled'?`<button class="primary" onclick="finalize('${t.id}')">🏁 Finalizar</button><button class="danger" onclick="cancel('${t.id}')">Cancelar</button>`:''}</div>${ps.length?`<h4>Ranking actual</h4>${ps.slice(0,10).map((p,i)=>`<div class="row payout"><span>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)} ${esc(p.display_name)}</span><b>${p.best_score} pts</b></div>`).join('')}`:''}${pay.length?`<h4>Pagos</h4>${pay.map(p=>`<div class="payout row"><span>${p.place===1?'🥇':p.place===2?'🥈':'🥉'} ${money(p.amount_cop)} · ${p.status}</span>${p.status==='pending'?`<button class="secondary" onclick="paid('${p.id}')">Marcar pagado</button>`:''}</div>`).join('')}`:''}</article>`}).join('')}window.finalize=async id=>{if(!confirm('¿Finalizar y generar el podio?'))return;const {error}=await db.rpc('tecnomath_tournament_finalize',{p_tournament_id:id});if(error)alert(error.message);else load()};window.cancel=async id=>{if(!confirm('¿Cancelar este torneo?'))return;const {error}=await db.rpc('tecnomath_tournament_cancel',{p_tournament_id:id});if(error)alert(error.message);else load()};window.paid=async id=>{const note=prompt('Nota opcional del pago:','Pago entregado en la feria');if(note===null)return;const {error}=await db.rpc('tecnomath_tournament_mark_payout_paid',{p_payout_id:id,p_note:note});if(error)alert(error.message);else load()};function money(n){return '$'+Number(n||0).toLocaleString('es-CO')+' COP'}function fmt(x){return new Date(x).toLocaleString('es-CO')}function label(s){return ({draft:'📝 BORRADOR',open:'🟢 INSCRIPCIONES',live:'🔴 EN VIVO',finished:'🏁 FINALIZADO',cancelled:'❌ CANCELADO'})[s]||s}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})()</script></body></html>
