<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juegos enviados · TecnoMath</title><link rel="stylesheet" href="../../css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="../../js/tecnomath-auth.js?v=20260913-games"></script><style>body{background:#060610;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#0d0d1a;border:1px solid #292943;border-radius:16px;padding:20px;margin:16px 0}.game{border:1px solid #292943;border-radius:14px;padding:18px;margin:14px 0;background:#090914}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.muted{color:#aaa}.badge{display:inline-block;padding:5px 9px;border-radius:8px;background:#222238}.pending{color:#ffe600}.reviewing{color:#00ffff}.approved{color:#39ff14}.rejected{color:#ff8aa2}.published{color:#39ff14}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.review{background:#00cfe8;color:#001}.approve{background:#39ff14;color:#001}.reject{background:#ff416c;color:#fff}.download{background:#00ffff;color:#001;text-decoration:none}.status{margin-top:15px;padding:12px;border-radius:10px;background:#111126}.empty{padding:30px;text-align:center;color:#aaa}.review-note{margin-top:8px;padding:10px 12px;border-left:3px solid #00cfe8;background:#111126;color:#cfeff5;border-radius:8px;font-size:13px}.error{border-color:#ff416c!important;color:#ff8aa2}</style>    <script src="/js/i18n.js" defer></script>
</head><body><div class="wrap"><a href="index.html" style="color:#00ffff">← Volver al panel</a><div class="card"><h1>🎮 Juegos enviados</h1><p class="muted">Sistema oficial: Supabase Auth + PostgreSQL + Storage. Flujo: Pendiente → En revisión → Aprobado → Publicado, o Rechazado.</p><div id="status" class="status">Comprobando administrador…</div><div id="list"></div></div></div>
<script>'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const auth=window.TecnomathAuth;let db=null;function status(t,ok=true){$('status').textContent=t;$('status').className='status'+(ok?'':' error')}function date(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-CO')}function bytes(n){n=Number(n||0);if(!n)return'—';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'}
async function load(){const list=$('list');try{const {data,error}=await db.from('tecnomath_game_submissions').select('*').order('created_at',{ascending:false});if(error)throw error;if(!data?.length){list.innerHTML='<div class="empty">No hay juegos enviados.</div>';status('Actualizado.');return}list.innerHTML=data.map(g=>{const s=String(g.status||'pending'),canReview=s==='pending',canDecide=s==='reviewing'||s==='pending';return `<article class="game"><div class="head"><div><h2>${esc(g.name||'Juego')}</h2><div class="muted">👤 ${esc(g.author_name||'Usuario')} · ${esc(g.author_email||'')}</div><div class="muted">📅 ${esc(date(g.created_at))}${g.package_path?' · 📦 Paquete en Storage':''}</div></div><span class="badge ${esc(s)}">${esc(s.toUpperCase())}</span></div><p>${esc(g.description||'Sin descripción')}</p>${s==='pending'?'<div class="review-note">📧 Al pulsar <b>Empezar a aprobar</b>, el juego pasa a <b>En revisión</b> y el sistema de correo puede notificar al autor.</div>':''}<div class="actions">${g.package_path?`<button class="btn download" onclick="downloadGame('${esc(g.id)}')">⬇️ Descargar ZIP</button>`:''}${g.game_url?`<a class="btn download" href="${esc(g.game_url)}" target="_blank" rel="noopener">🔗 Probar URL</a>`:''}${canReview?`<button class="btn review" onclick="startReview('${esc(g.id)}')">🔍 Empezar a aprobar</button>`:''}${canDecide?`<button class="btn approve" onclick="approveGame('${esc(g.id)}')">✅ Aprobar y publicar</button><button class="btn reject" onclick="rejectGame('${esc(g.id)}')">❌ Rechazar</button>`:''}${s==='approved'?'<span>⏳ GitHub publicará automáticamente…</span>':''}${s==='published'&&g.published_url?`<a class="btn download" href="${esc(g.published_url)}" target="_blank" rel="noopener">🎮 Abrir publicado</a>`:''}</div></article>`}).join('');status('Actualizado.')}catch(e){list.innerHTML='<span style="color:#ff8aa2">❌ '+esc(e.message)+'</span>';status('Error al cargar solicitudes.',false)}}
async function startReview(id){if(!confirm('¿Empezar la revisión?'))return;try{const user=await auth.currentUser();if(!user||!(await auth.isAdmin()))throw Error('Solo un administrador puede revisar.');const {error}=await db.from('tecnomath_game_submissions').update({status:'reviewing',reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id).eq('status','pending');if(error)throw error;status('🔍 Revisión iniciada.');await load()}catch(e){status('❌ '+e.message,false)}}
async function approveGame(id){if(!confirm('¿Aprobar este juego? GitHub lo publicará automáticamente.'))return;try{const user=await auth.currentUser();if(!user||!(await auth.isAdmin()))throw Error('Solo un administrador puede aprobar.');const {data:g,error:getErr}=await db.from('tecnomath_game_submissions').select('*').eq('id',id).single();if(getErr)throw getErr;if(g.status!=='pending'&&g.status!=='reviewing')throw Error('Esta solicitud ya fue procesada.');if(g.source_type==='upload'&&!g.package_path)throw Error('El paquete no está disponible en Storage.');const {error}=await db.from('tecnomath_game_submissions').update({status:'approved',reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id).in('status',['pending','reviewing']);if(error)throw error;status('✅ Aprobado. Quedó en cola para publicación automática.');await load()}catch(e){status('❌ '+e.message,false)}}
async function rejectGame(id){const reason=prompt('Motivo del rechazo (opcional):')??'';try{const user=await auth.currentUser();if(!user||!(await auth.isAdmin()))throw Error('Solo un administrador puede rechazar.');const {error}=await db.from('tecnomath_game_submissions').update({status:'rejected',rejection_reason:reason,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id).in('status',['pending','reviewing']);if(error)throw error;status('❌ Juego rechazado.');await load()}catch(e){status('❌ '+e.message,false)}}
async function downloadGame(id){try{const {data:g,error}=await db.from('tecnomath_game_submissions').select('package_path,name').eq('id',id).single();if(error)throw error;if(!g.package_path)throw Error('Este envío no tiene paquete.');const {data,error:e}=await db.storage.from('game-submissions').createSignedUrl(g.package_path,300);if(e)throw e;const a=document.createElement('a');a.href=data.signedUrl;a.download=(g.name||'juego').replace(/[^a-z0-9_-]+/gi,'-')+'.zip';a.target='_blank';a.click()}catch(e){status('❌ '+e.message,false)}}
(async()=>{try{db=await auth.getClient();const user=await auth.currentUser();if(!user||!(await auth.isAdmin())){location.href='../../auth.html';return}status('Cargando…');await load()}catch(e){status('❌ '+e.message,false)}})();</script></body></html>
