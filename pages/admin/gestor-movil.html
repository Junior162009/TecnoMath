<style>body{margin:0;background:#060610;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(92vw,620px);padding:26px;border:1px solid #292943;border-radius:18px;background:#0d0d1a;box-shadow:0 18px 50px #0008}.card h1{color:#00ffff}.card p{color:#aaa;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions a{flex:1;min-width:200px;padding:13px;border-radius:10px;text-align:center;text-decoration:none;font-weight:900;background:#39ff14;color:#001}.actions a.secondary{background:transparent;color:#00ffff;border:1px solid #00ffff}</style>

</head><body><main class="card"><h1>📱 Gestor de Juegos</h1><p id="status">Comprobando permisos de Clase A…</p><div class="actions" id="actions" hidden><a href="./games-manager.html">🎮 Abrir Gestor de Juegos</a><a class="secondary" href="./index.html">← Centro de Control</a></div></main>
<script>(async()=>{try{const ready=await TecnomathAdminGuard.requireAdmin({redirect:true});if(!TecnomathAdminGuard.isClassA(ready.profile))throw new Error('Esta herramienta requiere un administrador Clase A.');document.getElementById('status').textContent='✅ Acceso Clase A confirmado.';document.getElementById('actions').hidden=false}catch(e){console.error('Gestor móvil:',e);document.getElementById('status').textContent=e.message||'No se pudo comprobar el acceso.'}})();</script></body></html>
