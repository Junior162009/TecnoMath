<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 Competencia | TecnoMath</title><script src="../js/tecnomath-auth.js"></script><style>html,body{margin:0;width:100%;height:100%;background:#050509;color:#fff;font-family:Arial,sans-serif;overflow:hidden}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}.bar{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);background:#0b0e19ee;border:1px solid #ffd54a;border-radius:14px;padding:8px;display:flex;gap:8px;align-items:center;max-width:calc(100% - 20px)}button{border:0;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.send{background:#39ff14}.back{background:#303750;color:#fff}#status{font-size:12px;color:#ddd}</style>    <script src="/js/i18n.js" defer></script>
</head><body><div class="bar"><b>🏆 TORNEO</b><button class="send" id="send">ENVIAR RESULTADO</button><button class="back" id="back">SALIR</button><span id="status">Jugando…</span></div><iframe id="game" allow="fullscreen"></iframe><script>(async()=>{const q=new URLSearchParams(location.search),id=q.get('id'),game=q.get('game'),$=x=>document.getElementById(x);if(!id||!game){$('status').textContent='Faltan datos.';return}const db=await TecnomathAuth.getClient(),src=new URL(game,location.origin);src.searchParams.set('tournament',id);$('game').src=src.href;window.addEventListener('message',e=>{if(e.data?.type==='tecnomath:tournament-submitted'){$('status').textContent='✅ Resultado enviado: '+e.data.score;$('send').disabled=true}});$('back').onclick=()=>location.href='tournament.html?id='+encodeURIComponent(id);$('send').onclick=async()=>{try{let score=null;const w=$('game').contentWindow;for(const v of [w.score,w.gameScore,w.currentScore,w.points,w.puntos,w.finalScore]){const n=Number(v);if(Number.isFinite(n)){score=Math.max(0,Math.floor(n));break}}if(score===null){for(const s of ['#score','#game-score','#scoreValue','.score','[data-score]']){const el=w.document.querySelector(s);if(el){const n=Number(String(el.textContent||el.value||'').replace(/[^0-9.-]/g,''));if(Number.isFinite(n)){score=Math.max(0,Math.floor(n));break}}}}if(score===null)throw Error('No pude detectar la puntuación. Haz que el juego llame a TecnomathTournament.submit(score).');w.postMessage({type:'tecnomath:tournament-score',score},'*');$('status').textContent='Enviando…'}catch(e){$('status').textContent='❌ '+e.message}}})()</script></body></html>
