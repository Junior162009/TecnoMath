<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Consulta tu progreso en TecnoMath: experiencia, nivel, monedas, racha, partidas, precisión, materias y logros."><link rel="canonical" href="https://tecnomath.online/pages/progreso/index.html"><title>Mi Progreso | TecnoMath — Estadísticas y logros</title><style>body{margin:0;font-family:Arial,sans-serif;background:#080b18;color:#eef2ff}.app{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{color:#7de7ff;text-decoration:none}.hero,.card{background:#111733;border:1px solid #26315c;border-radius:20px;padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card b{display:block;font-size:26px;margin-top:8px}.label{color:#aeb8da;font-size:13px}.xp{height:12px;background:#050817;border-radius:99px;overflow:hidden;margin:15px 0}.xp i{display:block;height:100%;background:linear-gradient(90deg,#6be7ff,#9b7bff)}h1{margin:8px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.achievement{padding:12px;border-bottom:1px solid #26315c}.empty{color:#8490b5}@media(max-width:700px){.app{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}</style>    <script src="/js/i18n.js" defer></script>
</head><body><main class="app"><div class="top"><div><a class="back" href="/">← Volver a TecnoMath</a><h1>📈 Mi Progreso</h1><span class="label">Tu avance global en todos los juegos</span></div><div id="level" aria-live="polite">⭐ Nivel 1</div></div><section class="hero" aria-labelledby="xpText"><b id="xpText">0 XP</b><div class="xp" aria-hidden="true"><i id="xpBar" style="width:0%"></i></div><span class="label" id="xpNext">Sigue jugando para subir de nivel</span></section><section class="grid" aria-label="Estadísticas generales"><div class="card"><span class="label">🪙 Monedas</span><b id="coins">0</b></div><div class="card"><span class="label">🔥 Racha</span><b id="streak">0 días</b></div><div class="card"><span class="label">🎮 Partidas</span><b id="games">0</b></div><div class="card"><span class="label">🎯 Precisión</span><b id="accuracy">0%</b></div></section><section class="two"><div class="card"><h2>🧠 Progreso por materia</h2><div id="topics" class="empty">Aún no hay datos.</div></div><div class="card"><h2>🏅 Logros</h2><div id="achievements" class="empty">Juega para desbloquear logros.</div></div></section></main><script src="/js/tecnomath-progress.js?v=20260920"></script><script>const names={first_win:'🎯 Primer acierto',century:'💯 Centuria',streak3:'🔥 Racha de 3 días',master:'👑 Maestro',precision:'🎯 Precisión experta'};function render(){const p=TecnoMathProgress.read(),total=p.correct+p.wrong,acc=total?Math.round(p.correct/total*100):0,level=Math.max(1,Number(p.level)||1),xp=Number(p.xp)||0,base=(level-1)**2*100,next=level**2*100,percent=next>base?Math.min(100,Math.round((xp-base)/(next-base)*100)):100;document.getElementById('level').textContent='⭐ Nivel '+level;document.getElementById('xpText').textContent=xp+' XP';document.getElementById('xpBar').style.width=percent+'%';document.getElementById('xpNext').textContent=next-xp>0?(next-xp)+' XP para el siguiente nivel':'¡Nivel máximo actual!';document.getElementById('coins').textContent=Number(p.coins)||0;document.getElementById('streak').textContent=(Number(p.streak)||0)+' días';document.getElementById('games').textContent=Number(p.games)||0;document.getElementById('accuracy').textContent=acc+'%';const topics=Object.entries(p.topics||{});document.getElementById('topics').innerHTML=topics.length?topics.map(([n,v])=>{const t=(Number(v.correct)||0)+(Number(v.wrong)||0),a=t?Math.round((Number(v.correct)||0)/t*100):0;return '<div class="achievement"><b>'+n+'</b><span class="label"> '+a+'% · '+(Number(v.correct)||0)+' correctas</span></div>'}).join(''):'Aún no hay datos.';document.getElementById('achievements').innerHTML=p.achievements?.length?p.achievements.map(x=>'<div class="achievement">'+(names[x]||x)+'</div>').join(''):'Juega para desbloquear logros.'}render();window.addEventListener('tecnomath:progress',render);window.addEventListener('load',()=>{if(window.TecnoMathProgress?.sync)window.TecnoMathProgress.sync().then(render).catch(()=>{})});</script></body></html>
