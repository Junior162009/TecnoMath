<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda TecnoMath</title><style>body{font-family:Arial;background:#10152b;color:#fff;margin:0;padding:24px}header{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.status{padding:12px 16px;background:#20294b;border-radius:14px}.grid{max-width:900px;margin:25px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.card{background:#20294b;padding:20px;border-radius:20px;text-align:center}.icon{font-size:64px}button{padding:10px 14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.premium{max-width:900px;margin:auto;background:#3b2b62;padding:20px;border-radius:20px}.ad{max-width:900px;margin:16px auto;padding:20px;background:#253b35;border-radius:20px}</style><body><header><h1>🛒 Tienda TecnoMath</h1><div class=status id=status></div></header><section class=premium><h2>👑 TecnoMath Premium</h2><p>Sin anuncios, skins Premium y recompensas mejoradas.</p><button onclick="alert('Conecta aquí tu proveedor de pagos para activar Premium tras confirmar el pago.')">Activar Premium</button></section><section class=ad><h2>🎁 Recompensa</h2><p>Obtén monedas al completar un anuncio recompensado. Máximo 5 al día.</p><button onclick="claim()">▶ Ver anuncio y reclamar</button><small id=admsg></small></section><main class=grid id=grid></main><script src="/js/tecnomath-progress.js?v=5"></script><script src="/js/tecnomath-economy.js?v=1"></script><script>function render(){const e=TecnoMathEconomy,p=TecnoMathProgress.read(),s=e.state();status.innerHTML=`🪙 ${p.coins} monedas · ${s.premium?'👑 PREMIUM':'Cuenta gratuita'}`;grid.innerHTML=e.skins.map(x=>{let own=s.inventory.includes(x.id),eq=s.equipped===x.id,locked=x.premium&&!s.premium;return `<article class=card><div class=icon>${x.icon}</div><h3>${x.name}</h3><p>${x.premium?'👑 Premium':x.price+' 🪙'}</p><button ${locked?'disabled':''} onclick="action('${x.id}')">${eq?'Equipada':own?'Equipar':locked?'Requiere Premium':'Comprar'}</button></article>`}).join('')}function action(id){let s=TecnoMathEconomy.state(),x=TecnoMathEconomy.skins.find(a=>a.id===id);let z=s.inventory.includes(id)?TecnoMathEconomy.equip(id):TecnoMathEconomy.buy(id);if(!z.ok)alert(z.error);render()}function claim(){const z=TecnoMathEconomy.rewardAd();admsg.textContent=z.ok?` +${z.coins} monedas. Conecta un proveedor de anuncios recompensados y llama rewardAd() solo después de recibir su callback verificado.`:z.error;render()}window.addEventListener('tecnomath:progress',render);window.addEventListener('tecnomath:economy',render);setTimeout(render,300)</script></body></html>
