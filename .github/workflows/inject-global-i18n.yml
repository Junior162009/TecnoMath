name: Inject TecnoMath global i18n

on:
  push:
    branches: [feat/global-i18n-clean]
    paths:
      - '**/*.html'
      - '.github/workflows/inject-global-i18n.yml'

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject i18n runtime into HTML documents without changing line endings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          marker = b'<script src="/js/i18n.js" defer></script>'
          changed = []
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git', 'node_modules'} for part in path.parts):
                  continue
              raw = path.read_bytes()
              if b'/js/i18n.js' in raw:
                  continue
              newline = b'\r\n' if b'\r\n' in raw else b'\n'
              if re.search(br'</head>', raw, flags=re.I):
                  replacement = b'    ' + marker + newline + b'</head>'
                  raw = re.sub(br'</head>', replacement, raw, count=1, flags=re.I)
              else:
                  raw = marker + newline + raw
              path.write_bytes(raw)
              changed.append(str(path))
          print(f'Injected i18n into {len(changed)} HTML files')
          for item in changed:
              print(item)
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'No HTML files required migration.'
            exit 0
          fi
          git commit -m 'feat(i18n): integrate global runtime into HTML pages'
          git push
