name: Generar 5 videos diarios de TecnoMath Retos

on:
  schedule:
    # 12:00 UTC = 07:00 en Colombia
    - cron: "0 12 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tecnomath-retos-video-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Instalar Python y FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg y Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Instalar dependencias de generación
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow edge-tts
          python -m playwright install --with-deps chromium
      - name: Generar cinco MP4 desde minijuegos reales de TecnoMath
        env:
          TECNOMATH_SITE_BASE: https://tecnomath.online/
          TTS_VOICE: es-CO-SalomeNeural
          VIDEO_OUTPUT_DIR: output/tecnomath-retos
          TECNOMATH_VIDEO_COUNT: "5"
          GAMEPLAY_CAPTURE_SECONDS: "9"
        run: python scripts/generate_tecnomath_retos_videos.py
      - name: Validar manifiesto y cinco videos antes de publicar el artefacto
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path("output/tecnomath-retos")
          manifest_path = root / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit("ERROR: falta manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          videos = manifest.get("videos", [])
          if manifest.get("count") != 5 or len(videos) != 5:
              raise SystemExit(f"ERROR: se esperaban cinco videos en manifest.json; hay {len(videos)}")
          expected = [f"video-{i:02d}.mp4" for i in range(1, 6)]
          actual_names = sorted(p.name for p in root.glob("*.mp4"))
          if actual_names != expected:
              raise SystemExit(f"ERROR: nombres MP4 inesperados. Esperados={expected}; encontrados={actual_names}")
          for item in videos:
              if item.get("file") not in expected:
                  raise SystemExit(f"ERROR: nombre no permitido en manifest.json: {item.get('file')}")
              path = root / item["file"]
              if not path.is_file() or path.stat().st_size <= 1024:
                  raise SystemExit(f"ERROR: MP4 ausente o de 1 KB o menos: {path}")
              data = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "stream=codec_name,codec_type,width,height", "-show_entries",
                  "format=duration", "-of", "json", str(path)], text=True))
              streams = data.get("streams", [])
              video = next((s for s in streams if s.get("codec_type") == "video"), None)
              audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
              duration = float(data.get("format", {}).get("duration", 0))
              if not video or (video.get("codec_name"), video.get("width"), video.get("height")) != ("h264", 1080, 1920):
                  raise SystemExit(f"ERROR: video H.264/1080x1920 inválido: {path}")
              if duration <= 0:
                  raise SystemExit(f"ERROR: duración inválida: {path}")
              if item.get("gameplay_captured") is not True or item.get("gameplay_motion_validated") is not True or item.get("validated") is not True or item.get("validation_status") != "passed":
                  raise SystemExit(f"ERROR: gameplay real/movimiento no verificado en manifest: {path}")
              if not item.get("minigame") or item.get("resolution") != "1080x1920":
                  raise SystemExit(f"ERROR: metadatos obligatorios incompletos en manifest: {path}")
              if item.get("audio_codec") == "aac" and (not audio or audio.get("codec_name") != "aac"):
                  raise SystemExit(f"ERROR: el manifiesto declara AAC pero falta el audio AAC: {path}")
              if audio and audio.get("codec_name") != "aac":
                  raise SystemExit(f"ERROR: codec de audio inválido: {path}")
              print(f"VALID {path.name}: {duration:.2f}s H.264 1080x1920 + " + ("AAC" if audio else "sin audio (fallback)"))
          mp4s = list(root.glob("*.mp4"))
          if len(mp4s) != 5:
              raise SystemExit(f"ERROR: se esperaban exactamente cinco MP4; hay {len(mp4s)}")
          print("VALIDATION OK: five real-game MP4 and manifest")
          PY
      - name: Guardar MP4 y manifiesto como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: tecnomath-retos-videos
          path: output/tecnomath-retos/
          if-no-files-found: error
          retention-days: 30
      - name: Conservar logs de diagnóstico si falla la generación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tecnomath-retos-diagnostics-${{ github.run_id }}
          path: |
            output/tecnomath-retos/
          if-no-files-found: warn
          retention-days: 7
