<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Runner</title><style>body{margin:0;background:#69b;color:white;font-family:Arial;text-align:center;overflow:hidden}#p{position:absolute;bottom:30px;left:18%;font-size:50px}#o{position:absolute;bottom:30px;right:-50px;font-size:50px}#q{margin:25px;font-size:30px}button{padding:15px;margin:6px;font-size:22px}</style><h1>🏃 Math Runner</h1><div id=q></div><div id=a></div><div id=p>🏃</div><div id=o>🪨</div><script src="/js/tecnomath-progress.js?v=4"></script><script>let score=0;function next(){let x=1+Math.floor(Math.random()*12),y=1+Math.floor(Math.random()*12),c=x+y;q.textContent=`${x} + ${y} = ?`;let opts=[c,c+1,c-1,c+2].sort(()=>Math.random()-.5);a.innerHTML=opts.map(v=>`<button onclick="ans(${v===c})">${v}</button>`).join('')}function ans(ok){if(ok){score++;if(window.TecnoMathProgress)TecnoMathProgress.record({games:1,correct:1,wrong:0,xp:10,coins:2,topic:'Math Runner'});p.animate([{transform:'translateY(0)'},{transform:'translateY(-120px)'},{transform:'translateY(0)'}],{duration:500})}else alert('💥 ¡Chocaste!');next()}next()</script></html>
