<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade TecnoMath</title><style>body{margin:0;background:#10152b;color:white;font-family:Arial;text-align:center}h1{margin:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:18px}.card{background:#20294b;border-radius:18px;padding:18px;cursor:pointer;box-shadow:0 6px 20px #0008;font-size:18px}.card:hover{transform:scale(1.03)}.icon{font-size:60px}button{border:0;border-radius:12px;padding:10px 18px;font-weight:bold}</style><h1>🎮 TecnoMath Arcade</h1><p>10 minijuegos estilo arcade</p><div class="grid" id="grid"></div><script src="/js/tecnomath-progress.js?v=4"></script><script>const games=[['math-runner','🏃','Math Runner'],['space-math','🚀','Space Math'],['zombie-math','🧟','Zombie Math'],['candy-numbers','🍬','Candy Numbers'],['math-bird','🐦','Math Bird'],['math-racer','🏎️','Math Racer'],['number-ninja','🥷','Number Ninja'],['puzzle-pop','🧩','Puzzle Pop'],['math-defense','🏰','Math Defense'],['treasure-math','💎','Treasure Math']];grid.innerHTML=games.map(g=>`<div class=card onclick="location.href='${g[0]}/'"><div class=icon>${g[1]}</div><b>${g[2]}</b><p><button>▶ Jugar</button></p></div>`).join('')</script></html>
