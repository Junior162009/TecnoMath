<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="description" content="💎DMVJY💎: asistente educativo.">
<title>💎DMVJY💎</title>
<link rel="stylesheet" href="css/ia.css">
<script src="/js/tecnomath-progress.js?v=20260922-1"></script>
    <script src="/js/i18n.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <a class="brand" href="../../index.html" aria-label="Volver a TecnoMath">
        <span class="brand-mark">💎</span>
        <span class="brand-name">💎DMVJY💎</span>
      </a>
      <button id="newChatBtn" class="new-chat" type="button"><span>＋</span> Nueva conversación</button>
      <nav class="side-nav" aria-label="Navegación">
        <a class="nav-item active" href="#"><span>✦</span> 💎DMVJY💎</a>
        <a class="nav-item" href="../../index.html"><span>⌂</span> Explorar TecnoMath</a>
      </nav>
      <div class="history-title">ASISTENTE</div>
      <div class="history-placeholder">Tu conversación actual<br><small>El historial se mantiene durante esta sesión.</small></div>
    </div>
    <div class="sidebar-bottom">
      <div class="ai-badge"><i></i><span><b>● En línea</b><small>Inteligencia artificial educativa</small></span></div>
    </div>
  </aside>

  <main class="main">
    <header class="mobile-topbar">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Abrir menú">☰</button>
      <span>💎DMVJY💎</span>
      <button id="mobileNewBtn" class="icon-btn" type="button" aria-label="Nueva conversación">＋</button>
    </header>

    <section class="chat">
      <div id="messages" class="messages" aria-live="polite"></div>

      <div class="composer-wrap">
        <div class="quick-actions" aria-label="Acciones rápidas">
          <button data-prompt="Explícame un tema de matemáticas paso a paso">🧮 Matemáticas</button>
          <button data-prompt="Explícame un tema de ciencias con un ejemplo">🔬 Ciencias</button>
          <button data-prompt="Ayúdame con español y explícame por qué">📚 Español</button>
          <button data-prompt="Explícame un concepto de tecnología de forma sencilla">💻 Tecnología</button>
          <button data-prompt="Créame un ejercicio de nivel escolar y luego revisa mi respuesta">📝 Crear ejercicio</button>
        </div>
        <form id="chatForm" class="composer">
          <textarea id="input" rows="1" maxlength="4000" placeholder="Pregunta lo que quieras..." aria-label="Pregunta para 💎DMVJY💎"></textarea>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Enviar">↑</button>
        </form>
        <div class="composer-foot">
          <span id="counter">0/4000</span>
          <span>💎DMVJY💎 enseña, practica y te guía. Verifica información importante.</span>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="sidebarBackdrop" class="backdrop"></div>
<script src="js/ia.js"></script>
</body>
</html>
