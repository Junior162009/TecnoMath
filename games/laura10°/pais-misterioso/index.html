<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BanderQuiz · País Misterioso</title>
<link rel="icon" href="logo.png">
<script src="/js/tecnomath-auth.js"></script>
<script src="/js/tecnomath-progress.js?v=20260911-10"></script>
<script src="banderquiz-paises.js?v=20260911-11"></script>
<style>
  *{box-sizing:border-box}

  body{
    margin:0;min-height:100vh;
    font-family:'Segoe UI',Poppins,system-ui,sans-serif;
    color:#fff;
    background:
      radial-gradient(1200px 800px at 85% -10%, #3b2359 0%, transparent 60%),
      radial-gradient(900px 700px at -10% 110%, #1a2a5a 0%, transparent 55%),
      #070a16;
    /* ⬇⬇ CAMBIO CLAVE: de grid centrado a bloque normal ⬇⬇ */
    display:block;
    padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  /* El centrado horizontal ahora lo hace el wrap (margin auto) */
  .wrap{
    width:min(720px,100%);
    margin:0 auto;
  }

  /* ---------- Header ---------- */
  .top{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .btn{
    border:1px solid #ffffff12;background:#ffffff0a;color:#dfe4f2;
    border-radius:12px;padding:9px 14px;
    font-weight:700;font-size:.88rem;font-family:inherit;cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,transform .1s;
  }
  .btn:hover{background:#ffffff16;color:#fff;border-color:#ffffff22}
  .btn:active{transform:scale(.96)}
  .btn.icon{padding:9px 12px;font-size:1rem;line-height:1}
  .brand{
    font-weight:800;flex:1;text-align:center;font-size:1rem;
    letter-spacing:.3px;color:#eaeefb;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* ---------- Card ---------- */
  .card{
    position:relative;
    background:linear-gradient(180deg,#131a32f2,#0d1226f2);
    border:1px solid #ffffff12;
    border-radius:28px;
    padding:28px 26px 22px;
    box-shadow:0 30px 80px #000a, 0 0 0 1px #ffffff06 inset;
    text-align:center;
    transition:box-shadow .3s;
  }
  .card.correct{animation:okPulse .8s ease}
  .card.wrong{animation:koShake .55s ease}
  @keyframes okPulse{
    0%,100%{box-shadow:0 30px 80px #000a}
    40%{box-shadow:0 0 0 6px #22c55e88, 0 30px 80px #000a}
  }
  @keyframes koShake{
    0%,100%{transform:translateX(0)}
    20%,60%{transform:translateX(-8px)}
    40%,80%{transform:translateX(8px)}
  }

  h1{
    font-size:clamp(1.7rem,5.5vw,2.2rem);
    margin:2px 0 6px;font-weight:800;letter-spacing:-.5px;
    background:linear-gradient(180deg,#fff 0%,#b8c0e0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:#8b94ae;margin:0 0 16px;font-size:.92rem}

  /* ---------- Stats ---------- */
  .stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .stat{
    background:#ffffff08;border:1px solid #ffffff0c;
    border-radius:99px;padding:6px 12px;
    font-weight:700;font-size:.88rem;
    display:inline-flex;align-items:center;gap:4px;
  }
  .stat b{color:#fff}

  .best-info{
    margin-top:10px;color:#7d859e;
    font-size:.8rem;font-weight:600;letter-spacing:.2px;
  }
  .best-info b{color:#f5c518}

  /* ---------- Pistas ---------- */
  .clues{display:grid;gap:8px;margin:20px 0 18px}
  .clue{
    background:#ffffff06;border:1px solid #ffffff0c;
    border-radius:14px;padding:12px 14px;
    text-align:left;display:flex;gap:12px;align-items:flex-start;
    transition:background .25s,border-color .25s,opacity .25s;
  }
  .clue:not(.hidden){background:#ffffff0a;border-color:#ffffff16}
  .clue.hidden{opacity:.42}
  .clue-icon{font-size:1.2rem;line-height:1.25;flex:0 0 auto;width:24px;text-align:center}
  .clue-body{flex:1;min-width:0;line-height:1.45;color:#e6e9f2}
  .clue-label{
    color:#f5c518;font-weight:700;display:block;
    margin-bottom:4px;font-size:.84rem;letter-spacing:.4px;text-transform:uppercase;
  }
  .clue-value{font-size:1.02rem;color:#e6e9f2}
  .clue-lock{color:#7a829b;font-style:italic;font-size:.88rem}

  /* Bandera dentro de la pista */
  .flag-display{margin-top:6px}
  .flag-img{
    display:block;width:130px;max-width:100%;height:78px;
    object-fit:contain;border-radius:8px;
    background:#ffffff08;padding:4px;
    transition:filter .4s,box-shadow .4s;
  }
  .flag-emoji{
    display:inline-block;font-size:58px;line-height:1.1;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    transition:filter .4s;
  }
  .flag-display.glow-correct{filter:drop-shadow(0 0 22px #22c55ec0)}
  .flag-display.glow-wrong{filter:drop-shadow(0 0 22px #ef4444c0)}

  /* ---------- Input + acciones ---------- */
  .answer{
    width:100%;border:2px solid #ffffff12;background:#0a0f22;
    color:#fff;border-radius:14px;padding:14px 16px;
    font-size:1.05rem;font-family:inherit;outline:0;
    transition:border-color .2s,box-shadow .2s;
    /* Evita que el navegador haga scroll al enfocar en algunos móviles */
    scroll-margin-top:20px;
  }
  .answer::placeholder{color:#5f6884}
  .answer:focus{border-color:#f5c518;box-shadow:0 0 0 4px #f5c51820}

  .actions{display:flex;gap:10px;margin-top:10px}
  .actions button{
    flex:1;border:0;border-radius:14px;padding:14px;
    font-weight:800;font-size:1rem;font-family:inherit;
    cursor:pointer;transition:transform .1s,filter .15s;
  }
  .actions button:hover{filter:brightness(1.08)}
  .actions button:active{transform:scale(.98)}
  .actions button:disabled{opacity:.45;cursor:not-allowed;filter:none}

  .check{
    background:linear-gradient(180deg,#f7d33a,#e9b800);
    color:#1a1400;
    box-shadow:0 4px 14px #f5c51840;
  }
  .skip{
    background:#222b45;color:#d9dff0;border:1px solid #ffffff10;
  }

  .link-btn{
    background:transparent;border:0;color:#7d859e;
    font-weight:700;cursor:pointer;margin-top:10px;
    font-size:.85rem;font-family:inherit;
    padding:8px 14px;border-radius:8px;
    transition:background .15s,color .15s;
  }
  .link-btn:hover{color:#fff;background:#ffffff0a}

  /* ---------- Mensaje ---------- */
  .msg{
    min-height:24px;margin-top:14px;
    font-weight:700;font-size:.95rem;color:#c8cfe0;
    transition:color .25s;
  }
  .msg.success{color:#4ade80}
  .msg.error{color:#f87171}
  .score{
    margin-top:6px;color:#7d859e;
    font-size:.82rem;font-weight:600;letter-spacing:.2px;
  }
  .score b{color:#c8cfe0}

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:#000c;
    display:none;place-items:center;padding:20px;z-index:10;
  }
  .overlay.show{display:grid;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .over{
    width:min(440px,100%);
    background:linear-gradient(180deg,#161d38,#0f1428);
    border:1px solid #ffffff16;border-radius:24px;
    padding:30px 26px;text-align:center;
    box-shadow:0 30px 80px #000b;
    animation:pop .35s ease;
  }
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  .over h2{margin:0 0 14px;font-size:2rem;letter-spacing:-.5px}
  .over p{line-height:1.7;margin:12px 0 22px;color:#c8cfe0;font-size:1rem}
  .over p b{color:#f5c518}
  .over .actions{display:flex;gap:10px}
  .over .actions button{
    flex:1;border:0;border-radius:14px;padding:13px;
    font-weight:800;font-size:1rem;font-family:inherit;cursor:pointer;
  }
  .new-record{
    display:inline-block;background:linear-gradient(180deg,#f7d33a,#e9b800);
    color:#1a1400;font-weight:900;
    padding:5px 12px;border-radius:99px;
    font-size:.78rem;margin-bottom:10px;letter-spacing:.3px;
  }

  @media(max-width:560px){
    body{padding:14px}
    .card{padding:20px 16px 16px;border-radius:22px}
    .actions{flex-direction:column}
    .top .reset{display:none}
    .flag-img{width:110px;height:66px}
    .over{padding:24px 20px}
  }
</style>
    <script src="/js/i18n.js" defer></script>
</head>
<body>
<main class="wrap">
  <div class="top">
    <button class="btn" id="back">← Menú</button>
    <div class="brand">🕵️ País Misterioso</div>
    <button class="btn icon" id="mute" title="Sonido">🔊</button>
    <button class="btn icon reset" id="reset" title="Reiniciar">🔄</button>
  </div>

  <section class="card" id="card">
    <h1>¿Qué país es?</h1>
    <p class="sub" id="sub">Adivina el país con las pistas.</p>

    <div class="stats">
      <span class="stat">⭐ <b id="score">0</b></span>
      <span class="stat">🔥 <b id="streak">0</b></span>
      <span class="stat">❤️ <b id="lives">3</b></span>
      <span class="stat">🎯 <b id="accuracy">0%</b></span>
    </div>

    <div class="best-info">
      🏅 Récord: <b id="bestScore">0</b> · 🔥 Mejor racha: <b id="bestStreak">0</b>
    </div>

    <div class="clues" id="clues"></div>

    <input id="answer" class="answer" autocomplete="off" autocapitalize="characters"
           spellcheck="false" enterkeyhint="done" placeholder="Escribe el nombre del país…">

    <div class="actions">
      <button class="skip" id="skip">💡 Otra pista (-20)</button>
      <button class="check" id="check">Comprobar ✓</button>
    </div>

    <button class="link-btn" id="giveup">🤷 No lo sé, muéstrame la respuesta</button>

    <div class="msg" id="msg">Preparando países…</div>
    <div class="score">Pista <b id="used">1</b>/5 · <b id="round">100</b> pts</div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="over">
    <h2>🏆 Partida terminada</h2>
    <p id="summary"></p>
    <div class="actions">
      <button class="check" id="retry">🔄 Jugar otra vez</button>
      <button class="skip" id="menu">🏠 Menú</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     0) UTILIDADES
     ========================================================= */
  const $ = function (id) { return document.getElementById(id); };

  const norm = function (s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[’'`´]/g, '')
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  };

  const codeToEmoji = function (cc) {
    const code = String(cc || '').toUpperCase();
    if (!/^[A-Z]{2}$/.test(code)) return '🏳️';
    try {
      return String.fromCodePoint(
        0x1F1E6 + code.charCodeAt(0) - 65,
        0x1F1E6 + code.charCodeAt(1) - 65
      );
    } catch (e) { return '🏳️'; }
  };

  /* =========================================================
     0.bis) SCROLL AL INICIO DE RONDA
     ---------------------------------------------------------
     Se llama al empezar cada ronda para asegurar que el jugador
     ve las pistas primero (arriba) y no el input (abajo).
     NUNCA usamos scrollIntoView, solo window.scrollTo.
     ========================================================= */
  function scrollToRoundTop() {
    try {
      window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
    } catch (e) {
      try { window.scrollTo(0, 0); } catch (e2) {}
    }
  }

  // Refuerzo: a veces la carga de la bandera (o la fuente) desplaza el layout
  // unos ms después; volvemos a subir una sola vez más para compensar.
  function scrollToRoundTopSoon() {
    scrollToRoundTop();
    setTimeout(scrollToRoundTop, 0);
    setTimeout(scrollToRoundTop, 80);
    setTimeout(scrollToRoundTop, 240);
  }

  /* =========================================================
     1) PAÍSES (se respeta window.BanderQuizCountries)
     ========================================================= */
  const FALLBACK_COUNTRIES = [
    ['ES','España'],['FR','Francia'],['IT','Italia'],['DE','Alemania'],['PT','Portugal'],
    ['GB','Reino Unido'],['IE','Irlanda'],['NL','Países Bajos'],['BE','Bélgica'],['CH','Suiza'],
    ['AT','Austria'],['SE','Suecia'],['NO','Noruega'],['DK','Dinamarca'],['FI','Finlandia'],
    ['IS','Islandia'],['PL','Polonia'],['CZ','Chequia'],['SK','Eslovaquia'],['HU','Hungría'],
    ['RO','Rumanía'],['BG','Bulgaria'],['GR','Grecia'],['HR','Croacia'],['RS','Serbia'],
    ['UA','Ucrania'],['RU','Rusia'],['TR','Turquía'],['MA','Marruecos'],['DZ','Argelia'],
    ['TN','Túnez'],['EG','Egipto'],['NG','Nigeria'],['KE','Kenia'],['ZA','Sudáfrica'],
    ['ET','Etiopía'],['GH','Ghana'],['SN','Senegal'],['US','Estados Unidos'],['CA','Canadá'],
    ['MX','México'],['GT','Guatemala'],['CU','Cuba'],['DO','República Dominicana'],['HT','Haití'],
    ['JM','Jamaica'],['PA','Panamá'],['CR','Costa Rica'],['CO','Colombia'],['VE','Venezuela'],
    ['EC','Ecuador'],['PE','Perú'],['BO','Bolivia'],['CL','Chile'],['AR','Argentina'],
    ['UY','Uruguay'],['PY','Paraguay'],['BR','Brasil'],['CN','China'],['JP','Japón'],
    ['KR','Corea del Sur'],['KP','Corea del Norte'],['IN','India'],['PK','Pakistán'],['BD','Bangladés'],
    ['TH','Tailandia'],['VN','Vietnam'],['PH','Filipinas'],['ID','Indonesia'],['MY','Malasia'],
    ['SG','Singapur'],['AU','Australia'],['NZ','Nueva Zelanda'],['SA','Arabia Saudita'],['IR','Irán'],
    ['IQ','Irak'],['IL','Israel'],['AE','Emiratos Árabes Unidos'],['QA','Catar'],['KZ','Kazajistán']
  ];

  const nameByCode = new Map();

  function buildNameMap(list) {
    (list || []).forEach(function (x) {
      if (Array.isArray(x) && x[0]) {
        nameByCode.set(String(x[0]).toUpperCase(), String(x[1] || x[0]));
      }
    });
  }

  function readCountriesFromWindow() {
    let src = [];
    try {
      if (Array.isArray(window.BanderQuizCountries)) src = window.BanderQuizCountries;
    } catch (e) { src = []; }
    return src
      .filter(function (x) {
        return Array.isArray(x) && /^[A-Za-z]{2}$/.test(String(x[0] || '')) && x[1];
      })
      .map(function (x) { return [String(x[0]).toUpperCase(), String(x[1])]; });
  }

  let countries = readCountriesFromWindow();

  if (!countries.length) {
    countries = FALLBACK_COUNTRIES.slice();
    try {
      const s = document.createElement('script');
      s.src = 'banderquiz-paises.js?v=' + Date.now();
      s.async = true;
      s.onload = function () {
        const loaded = readCountriesFromWindow();
        if (loaded.length) {
          countries = loaded;
          buildNameMap(countries);
          const sub = $('sub');
          if (sub) sub.textContent = 'Adivina el país con las pistas · ' + countries.length + ' países disponibles.';
        }
      };
      s.onerror = function () {};
      document.head.appendChild(s);
    } catch (e) {}
  }

  buildNameMap(countries);

  function getName(cc) {
    const code = String(cc || '').toUpperCase();
    try {
      if (typeof window.BanderQuizCountryName === 'function') {
        const n = window.BanderQuizCountryName(code);
        if (n && String(n) !== code) return String(n);
      }
    } catch (e) {}
    return nameByCode.get(code) || code;
  }

  /* =========================================================
     2) ALIAS / RESPUESTAS ACEPTADAS
     ========================================================= */
  const ALIAS_GROUPS = [
    ['Estados Unidos','EEUU','USA','Estados Unidos de América','United States'],
    ['Países Bajos','Paises Bajos','Holanda','Netherlands'],
    ['Reino Unido','Inglaterra','UK','Gran Bretaña','United Kingdom'],
    ['Corea del Sur','Corea Sur','South Korea'],
    ['Corea del Norte','Corea Norte','North Korea'],
    ['Chequia','República Checa','Republica Checa','Czech Republic'],
    ['Emiratos Árabes Unidos','Emiratos Arabes Unidos','EAU','UAE'],
    ['Arabia Saudita','Arabia Saudí','Arabia Saudi'],
    ['Catar','Qatar'],
    ['Vietnam','Viet Nam'],
    ['Rusia','Federación de Rusia','Russia'],
    ['Alemania','Germany'],['España','Espana','Spain'],['Francia','France'],['Italia','Italy'],
    ['Japón','Japon'],['México','Mexico'],['Perú','Peru'],['Brasil','Brazil'],['Turquía','Turquia'],
    ['Egipto','Egypt'],['Marruecos','Morocco'],['Grecia','Greece'],['Suiza','Switzerland'],
    ['Suecia','Sweden'],['Noruega','Norway'],['Dinamarca','Denmark'],['Finlandia','Finland'],
    ['Islandia','Iceland'],['Irlanda','Ireland'],['Polonia','Poland'],['Ucrania','Ukraine'],
    ['Argelia','Algeria'],['Túnez','Tunisia'],['Sudáfrica','South Africa'],['Etiopía','Ethiopia'],
    ['Canadá','Canada'],['Panamá','Panama'],['Colombia','Colombia'],['Venezuela','Venezuela'],
    ['Ecuador','Ecuador'],['Bolivia','Bolivia'],['Chile','Chile'],['Argentina','Argentina'],
    ['Uruguay','Uruguay'],['Paraguay','Paraguay'],['China','China'],['India','India'],
    ['Tailandia','Thailand'],['Filipinas','Philippines'],['Indonesia','Indonesia'],
    ['Malasia','Malaysia'],['Singapur','Singapore'],['Australia','Australia'],
    ['Nueva Zelanda','New Zealand'],['Irán','Iran'],['Irak','Iraq'],['Israel','Israel'],
    ['Kazajistán','Kazakhstan']
  ];

  const aliasIndex = new Map();
  ALIAS_GROUPS.forEach(function (group) {
    const set = new Set(group.map(norm).filter(Boolean));
    set.forEach(function (v) { aliasIndex.set(v, set); });
  });

  function namesFor(cc) {
    const n = norm(getName(cc));
    const group = aliasIndex.get(n);
    const set = new Set(group ? Array.from(group) : []);
    if (n) set.add(n);
    set.delete('');
    return set;
  }

  /* =========================================================
     3) CONTINENTES
     ========================================================= */
  const CONTINENT_BY_CODE = (function () {
    const m = {};
    const add = function (codes, name) {
      codes.split(' ').forEach(function (c) { m[c] = name; });
    };
    add('ES FR IT DE PT GB IE NL BE CH AT SE NO DK FI IS PL CZ SK HU RO BG GR HR RS UA RU BY LT LV EE MD AL MK BA ME SI XK MT CY LU LI AD MC SM VA', 'Europa');
    add('CN JP KR KP IN PK BD TH VN PH ID MY SG MM KH LA MN NP LK KZ UZ TM KG TJ AF IR IQ IL JO LB SY SA AE QA KW BH OM YE TR GE AM AZ', 'Asia');
    add('MA DZ TN EG LY NG KE ZA ET GH SN CI CM CD AO MZ TZ UG RW SO SD SS ML BF NE TD MR GM GW GN SL LR TG BJ GA CG CF GQ ZW ZM MW NA BW LS SZ MG MU SC CV ST KM DJ ER', 'África');
    add('US CA MX GT BZ SV HN NI CR PA CU DO HT JM BS BB TT GD LC VC AG KN DM PR', 'América del Norte');
    add('CO VE EC PE BO CL AR UY PY BR GY SR', 'América del Sur');
    add('AU NZ FJ PG SB VU NC PF WS TO TV KI NR FM MH PW GU AS CK NU WF', 'Oceanía');
    return m;
  })();

  /* =========================================================
     4) BANDERAS
     ========================================================= */
  const FLAG_JSON_URL = 'https://cdn.jsdelivr.net/npm/country-flag-emoji-json@2.0.0/dist/by-code.json';
  const FLAG_IMG_BASE = 'https://cdn.jsdelivr.net/npm/country-flag-emoji-json@2.0.0/dist/images/';

  let flagByCode = {};

  function flagUrl(cc) {
    const code = String(cc || '').toUpperCase();
    const entry = flagByCode[code];
    if (entry && typeof entry.image === 'string' && entry.image) return entry.image;
    return FLAG_IMG_BASE + code + '.svg';
  }

  function loadFlags() {
    let ctrl = null, t = null;
    try {
      if (typeof AbortController !== 'undefined') {
        ctrl = new AbortController();
        t = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 7000);
      }
      const opts = ctrl ? { signal: ctrl.signal, cache: 'force-cache' } : { cache: 'force-cache' };
      return fetch(FLAG_JSON_URL, opts)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) { if (data && typeof data === 'object') flagByCode = data; })
        .catch(function () { flagByCode = {}; })
        .then(function () { if (t) clearTimeout(t); });
    } catch (e) {
      if (t) clearTimeout(t);
      return Promise.resolve();
    }
  }

  // Devuelve un <img class="flag-display flag-img"> y, si todo falla, un <span class="flag-display flag-emoji">
  function flagNode(cc, hideAlt) {
    const img = document.createElement('img');
    img.className = 'flag-display flag-img';
    img.alt = hideAlt ? '' : 'Bandera de ' + getName(cc);
    img.decoding = 'async';
    img.loading = 'eager';
    img.src = flagUrl(cc);

    img.addEventListener('error', function onErr() {
      img.removeEventListener('error', onErr);
      if (!img.dataset.retried) {
        img.dataset.retried = '1';
        img.src = FLAG_IMG_BASE + String(cc || '').toUpperCase() + '.svg';
        return;
      }
      const span = document.createElement('span');
      span.className = 'flag-display flag-emoji';
      span.textContent = codeToEmoji(cc);
      if (img.parentNode) img.parentNode.replaceChild(span, img);
    });

    return img;
  }

  function glowFlag(type) {
    const el = document.querySelector('.flag-display');
    if (!el) return;
    el.classList.remove('glow-correct', 'glow-wrong');
    void el.offsetWidth;
    el.classList.add(type);
  }

  /* =========================================================
     5) SONIDO
     ========================================================= */
  const SOUND_LS = 'banderquiz-misterioso-sound-v1';
  let soundOn = true;
  let audioCtx = null;

  try { if (localStorage.getItem(SOUND_LS) === '0') soundOn = false; } catch (e) {}

  function ensureAudio() {
    if (!soundOn) return null;
    try {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  function playTone(freq, duration, type, volume) {
    const ctx = ensureAudio();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const v = typeof volume === 'number' ? volume : 0.07;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(v, ctx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.02);
    } catch (e) {}
  }

  const sfxCorrect = function () {
    playTone(660, 0.12, 'sine', 0.07);
    setTimeout(function () { playTone(880, 0.16, 'sine', 0.07); }, 100);
  };
  const sfxWrong = function () {
    playTone(220, 0.22, 'sawtooth', 0.06);
    setTimeout(function () { playTone(160, 0.22, 'sawtooth', 0.06); }, 130);
  };
  const sfxHint = function () { playTone(520, 0.08, 'triangle', 0.05); };
  const sfxGameOver = function () {
    playTone(440, 0.15, 'sine', 0.07);
    setTimeout(function () { playTone(330, 0.2, 'sine', 0.07); }, 140);
    setTimeout(function () { playTone(220, 0.3, 'sine', 0.07); }, 320);
  };

  function updateMuteBtn() {
    const b = $('mute');
    if (!b) return;
    b.textContent = soundOn ? '🔊' : '🔇';
    b.title = soundOn ? 'Silenciar' : 'Activar sonido';
  }

  /* =========================================================
     6) RÉCORDS
     ========================================================= */
  const BEST_LS = 'banderquiz-misterioso-best-v1';

  function loadBest() {
    try {
      const raw = localStorage.getItem(BEST_LS);
      if (raw) {
        const o = JSON.parse(raw);
        return {
          score: Number(o.score) || 0,
          streak: Number(o.streak) || 0,
          correct: Number(o.correct) || 0
        };
      }
    } catch (e) {}
    return { score: 0, streak: 0, correct: 0 };
  }

  let best = loadBest();

  function updateBestUI() {
    const a = $('bestScore'), b = $('bestStreak');
    if (a) a.textContent = best.score;
    if (b) b.textContent = best.streak;
  }

  function saveBestIfNeeded() {
    let changed = false;
    if (score > best.score) { best.score = score; changed = true; }
    if (streak > best.streak) { best.streak = streak; changed = true; }
    if (correct > best.correct) { best.correct = correct; changed = true; }
    if (changed) {
      try { localStorage.setItem(BEST_LS, JSON.stringify(best)); } catch (e) {}
    }
    updateBestUI();
  }

  /* =========================================================
     7) ESTADO
     ========================================================= */
  const MAX_CLUES = 5;
  const ROUND_START = 100;
  const ROUND_STEP = 20;
  const ROUND_MIN = 20;
  const RECENT_LIMIT = 8;

  let current = null;
  const recentCodes = [];
  let score = 0;
  let total = 0;
  let correct = 0;
  let streak = 0;
  let lives = 3;
  let clue = 1;
  let round = ROUND_START;
  let locked = false;
  let timer = null;
  let startingBestScore = 0;

  function clearTimer() {
    if (timer !== null) { clearTimeout(timer); timer = null; }
  }

  /* =========================================================
     8) PISTAS
     ========================================================= */
  function clueData() {
    const cc = current[0];
    const es = getName(cc);
    const words = es.trim().split(/\s+/).filter(Boolean).length;
    const continent = CONTINENT_BY_CODE[cc] || 'Mundo';
    return [
      { icon: '🏳️', label: 'Bandera',      type: 'flag' },
      { icon: '🔤', label: 'Primera letra', value: es.charAt(0).toUpperCase() },
      { icon: '📏', label: 'Longitud',      value: es.replace(/\s/g, '').length + ' letras' },
      { icon: '🌍', label: 'Continente',    value: continent },
      { icon: '🧩', label: 'Patrón',        value: words + ' palabra' + (words === 1 ? '' : 's') }
    ];
  }

  /* =========================================================
     9) RENDER
     ========================================================= */
  function render() {
    if (!current) return;
    const d = clueData();
    const cluesEl = $('clues');
    cluesEl.innerHTML = '';

    d.forEach(function (x, i) {
      const open = i < clue;

      const div = document.createElement('div');
      div.className = 'clue' + (open ? '' : ' hidden');

      const icon = document.createElement('span');
      icon.className = 'clue-icon';
      icon.textContent = x.icon;
      div.appendChild(icon);

      const body = document.createElement('div');
      body.className = 'clue-body';

      const label = document.createElement('span');
      label.className = 'clue-label';
      label.textContent = 'Pista ' + (i + 1) + ' · ' + x.label;
      body.appendChild(label);

      if (!open) {
        const lock = document.createElement('span');
        lock.className = 'clue-lock';
        lock.textContent = '🔒 Bloqueada';
        body.appendChild(lock);
      } else if (x.type === 'flag') {
        // Bandera real INLINE, dentro de la propia pista.
        body.appendChild(flagNode(current[0], true));
      } else {
        const val = document.createElement('span');
        val.className = 'clue-value';
        val.textContent = x.value;
        body.appendChild(val);
      }

      div.appendChild(body);
      cluesEl.appendChild(div);
    });

    $('used').textContent = clue;
    $('round').textContent = round;
    updateHintButton();
  }

  function update() {
    $('score').textContent = score;
    $('streak').textContent = streak;
    $('lives').textContent = lives;
    $('accuracy').textContent = (total ? Math.round(correct / total * 100) : 0) + '%';
  }

  function updateHintButton() {
    const btn = $('skip');
    if (!btn) return;
    if (!current || locked) { btn.disabled = true; return; }
    if (clue >= MAX_CLUES) {
      btn.disabled = true;
      btn.textContent = '💡 Sin más pistas';
    } else {
      btn.disabled = false;
      btn.textContent = '💡 Otra pista (-20)';
    }
  }

  /* =========================================================
     10) FLUJO
     ========================================================= */
  function pickCountry() {
    if (!countries.length) return null;
    const pool = countries.filter(function (c) { return recentCodes.indexOf(c[0]) === -1; });
    const source = pool.length ? pool : countries;
    const c = source[Math.floor(Math.random() * source.length)];
    recentCodes.push(c[0]);
    const lim = Math.min(RECENT_LIMIT, Math.max(1, Math.floor(countries.length / 2)));
    while (recentCodes.length > lim) recentCodes.shift();
    return c;
  }

  function next() {
    clearTimer();

    if (!countries.length) {
      $('msg').textContent = 'No se pudo cargar la base de países de BanderQuiz.';
      $('msg').className = 'msg error';
      return;
    }

    current = pickCountry();
    if (!current) {
      $('msg').textContent = 'No se pudo cargar la base de países de BanderQuiz.';
      $('msg').className = 'msg error';
      return;
    }

    locked = false;
    clue = 1;
    round = ROUND_START;

    $('answer').value = '';
    $('msg').textContent = 'Piensa antes de pedir otra pista.';
    $('msg').className = 'msg';

    render();

    /* ⬇⬇ CAMBIO CLAVE: cada ronda vuelve arriba ⬇⬇
       Se hace tras render() y se refuerza unos ms después
       por si el layout cambia al cargar la bandera. */
    scrollToRoundTopSoon();

    /* Autofocus solo en PC y sin scroll */
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouch) {
      setTimeout(function () {
        try {
          const inp = $('answer');
          if (inp && typeof inp.focus === 'function') {
            // preventScroll evita que el navegador baje hasta el input
            inp.focus({ preventScroll: true });
          }
          // Y por si algún navegador ignoró preventScroll, volvemos a subir.
          scrollToRoundTop();
        } catch (e) {}
      }, 60);
    }
  }

  function reveal() {
    if (locked || !current || clue >= MAX_CLUES) return;
    clue++;
    round = Math.max(ROUND_MIN, round - ROUND_STEP);
    sfxHint();
    render();
    $('msg').textContent = clue < MAX_CLUES ? 'Se desbloqueó una nueva pista.' : 'Ya tienes todas las pistas.';
    $('msg').className = 'msg';
    /* Nota: al desbloquear una pista NO hacemos scroll:
       el jugador ya está mirando la zona de pistas. */
  }

  function check() {
    if (locked || !current) return;
    const val = norm($('answer').value);
    if (!val) {
      $('msg').textContent = 'Escribe un país primero.';
      $('msg').className = 'msg';
      return;
    }
    const good = namesFor(current[0]).has(val);
    resolve(good, false);
  }

  function giveUp() {
    if (locked || !current) return;
    resolve(false, true);
  }

  function resolve(good, wasGiveUp) {
    if (locked || !current) return;
    locked = true;
    total++;

    if (good) {
      correct++;
      score += round;
      streak++;
      $('msg').textContent = '✅ ¡Correcto! Era ' + getName(current[0]) + '.';
      $('msg').className = 'msg success';
      sfxCorrect();
      flashCard('correct');
      glowFlag('glow-correct');
    } else {
      lives--;
      streak = 0;
      $('msg').textContent = (wasGiveUp ? '🤷 La respuesta era ' : '❌ No era ese. Era ') + getName(current[0]) + '.';
      $('msg').className = 'msg error';
      sfxWrong();
      flashCard('wrong');
      glowFlag('glow-wrong');
    }

    update();
    sync(false);
    updateHintButton();

    clearTimer();
    if (lives <= 0) {
      timer = setTimeout(gameOver, 1300);
    } else {
      /* La siguiente ronda volverá arriba porque next() llama a scrollToRoundTopSoon() */
      timer = setTimeout(next, 1600);
    }
  }

  function flashCard(type) {
    const card = $('card');
    if (!card) return;
    card.classList.remove('correct', 'wrong');
    void card.offsetWidth;
    card.classList.add(type);
    setTimeout(function () { card.classList.remove(type); }, 900);
  }

  /* =========================================================
     11) PROGRESO / GAME OVER / RESET
     ========================================================= */
  function sync(completed) {
    try {
      if (!window.TecnomathProgress || typeof window.TecnomathProgress.save !== 'function') return;
      window.TecnomathProgress.save('banderquiz-misterioso', {
        mode: 'misterioso',
        score: score,
        totalQuestions: total,
        correctAnswers: correct,
        wrongAnswers: Math.max(0, total - correct),
        accuracy: total ? Math.round(correct / total * 100) : 0,
        streak: streak,
        lives: lives,
        completed: !!completed
      });
    } catch (e) {}
  }

  function gameOver() {
    clearTimer();
    sfxGameOver();
    sync(true);

    const previousBest = startingBestScore;
    saveBestIfNeeded();

    const acc = total ? Math.round(correct / total * 100) : 0;
    const isNewRecord = score > previousBest && score > 0;

    let html = '';
    if (isNewRecord) html += '<span class="new-record">🏅 ¡Nuevo récord!</span><br>';
    html += 'Puntuación: <b>' + score + '</b><br>';
    html += 'Aciertos: <b>' + correct + '</b> de <b>' + total + '</b><br>';
    html += 'Precisión: <b>' + acc + '%</b><br>';
    html += 'Mejor racha: <b>' + streak + '</b>';
    $('summary').innerHTML = html;

    $('overlay').classList.add('show');
  }

  function reset() {
    clearTimer();
    startingBestScore = best.score;
    score = 0; total = 0; correct = 0; streak = 0; lives = 3;
    locked = false; current = null;
    recentCodes.length = 0;
    $('overlay').classList.remove('show');
    update();

    /* ⬇ Al reiniciar también subimos arriba antes de la primera ronda. */
    scrollToRoundTop();

    next();
  }

  /* =========================================================
     12) ARRANQUE
     ========================================================= */
  function bindUI() {
    $('back').onclick   = function () { location.href = 'menu.html'; };
    $('menu').onclick   = function () { location.href = 'menu.html'; };
    $('retry').onclick  = reset;
    $('reset').onclick  = reset;
    $('skip').onclick   = reveal;
    $('check').onclick  = check;
    $('giveup').onclick = giveUp;

    $('mute').onclick = function () {
      soundOn = !soundOn;
      try { localStorage.setItem(SOUND_LS, soundOn ? '1' : '0'); } catch (e) {}
      updateMuteBtn();
      if (soundOn) sfxHint();
    };

    $('answer').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); check(); }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (!$('overlay').classList.contains('show')) reveal();
      }
    });
  }

  function init() {
    try {
      bindUI();
      updateMuteBtn();
      updateBestUI();
      startingBestScore = best.score;

      const sub = $('sub');
      if (sub && countries.length) {
        sub.textContent = 'Adivina el país con las pistas · ' + countries.length + ' países disponibles.';
      }

      update();

      // Aseguramos que al entrar arrancamos arriba del todo.
      scrollToRoundTop();

      // 1º Arranca YA (independiente de red) — next() ya hace scrollToRoundTopSoon()
      next();

      // 2º Banderas en segundo plano
      loadFlags().catch(function () {});

      // 3º Por si el navegador restaura scroll al volver atrás desde otra página
      try {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      } catch (e) {}
      window.addEventListener('load', scrollToRoundTop);
    } catch (err) {
      if (window.console && console.error) console.error('[País Misterioso] Error al iniciar:', err);
      const msg = $('msg');
      if (msg) {
        msg.textContent = '⚠️ Error al iniciar el juego. Pulsa 🔄.';
        msg.className = 'msg error';
      }
      const ov = $('overlay');
      if (ov) ov.classList.remove('show');
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
