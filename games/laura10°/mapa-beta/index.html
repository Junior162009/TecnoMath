<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>BanderQuiz · Conquista el Mundo · Equal Earth</title>
<link rel="icon" href="../logo.png">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Poppins,system-ui,sans-serif;background:#080b18;color:#fff}body{overflow:hidden}.top{position:fixed;z-index:20;top:12px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 24px));display:flex;align-items:center;gap:14px;background:rgba(13,18,39,.9);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:20px;padding:10px 14px;box-shadow:0 15px 45px rgba(0,0,0,.35)}.back{border:0;background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.brand{font-weight:900;white-space:nowrap}.beta{font-size:.72rem;padding:4px 8px;border-radius:99px;background:#f5c518;color:#111;font-weight:900}.progress{flex:1;min-width:120px}.progress-line{height:9px;background:#252b43;border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#f5c518,#ff8a00);transition:width .35s}.progress-text{font-size:.76rem;color:#b9c0d8;margin-top:4px}.stats{display:flex;gap:7px}.stat{background:rgba(255,255,255,.07);padding:8px 10px;border-radius:12px;font-weight:800;white-space:nowrap}.map{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#18234a 0,#0b1024 52%,#050712 100%)}svg{width:100%;height:100%;display:block;touch-action:none}.country{fill:#626979;stroke:#9da5b9;stroke-width:.55;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s,filter .2s}.country:hover{fill:#8b93a6;filter:drop-shadow(0 0 5px rgba(245,197,24,.35))}.country.done{fill:#22b573;stroke:#b7f5d8;cursor:default;pointer-events:none;filter:none}.country.done:hover{fill:#22b573}.hint{position:fixed;z-index:10;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(8,12,28,.86);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:9px 14px;color:#d6dbee;text-align:center;font-size:.86rem;backdrop-filter:blur(10px)}.modal{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.58);backdrop-filter:blur(7px)}.modal.show{display:flex}.card{width:min(440px,100%);background:#11172e;border:1px solid rgba(255,255,255,.13);border-radius:26px;padding:25px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center}.flag{height:110px;display:flex;align-items:center;justify-content:center;margin:0 0 12px}.flag img{width:112px;height:84px;object-fit:contain;display:block;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5));image-rendering:auto}.flag-fallback{font-size:76px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.flag-emoji{font-size:76px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.eyebrow{color:#aeb7d0;font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:1px}.country-name{font-size:1.7rem;font-weight:900;margin:5px 0 15px}.input{width:100%;border:2px solid #303957;background:#080d20;color:#fff;border-radius:14px;padding:14px;font-size:1.05rem;outline:none}.input:focus{border-color:#f5c518}.actions{display:flex;gap:10px;margin-top:12px}.check,.cancel{flex:1;border:0;border-radius:14px;padding:13px;font-weight:900;cursor:pointer}.check{background:#f5c518;color:#111}.cancel{background:#252d48;color:#fff}.message{min-height:24px;margin-top:12px;font-weight:800}.ok{color:#51e39d}.bad{color:#ff7188}@media(max-width:700px){.top{flex-wrap:wrap}.brand{font-size:.9rem}.progress{order:5;flex-basis:100%}.stats{margin-left:auto}.stat{font-size:.78rem;padding:7px 8px}.hint{bottom:10px;font-size:.75rem;max-width:90%}}
</style>
<script src="/js/tecnomath-auth.js"></script>
<script src="/js/tecnomath-progress.js?v=20260911-10"></script>
    <script src="/js/i18n.js" defer></script>
</head>
<body>
<header class="top"><button class="back" id="back">← Menú</button><div class="brand">🌎 Conquista el Mundo <span class="beta">EQUAL EARTH</span></div><div class="progress"><div class="progress-line"><div class="progress-fill" id="fill"></div></div><div class="progress-text" id="progressText">Cargando progreso de tu cuenta…</div></div><div class="stats"><div class="stat">⭐ <span id="score">0</span></div><div class="stat">🔥 <span id="streak">0</span></div></div></header>
<main class="map" id="map"></main><div class="hint">🖐️ Arrastra para explorar · 🔍 rueda o pellizca para zoom · 👆 toca un país</div>
<div class="modal" id="modal"><section class="card"><div class="eyebrow">País seleccionado</div><div class="flag" id="flag"><span class="flag-emoji">🏳️</span></div><div class="country-name" id="countryName">País</div><input class="input" id="answer" autocomplete="off" placeholder="Escribe el nombre del país"><div class="actions"><button class="cancel" id="cancel">Cancelar</button><button class="check" id="check">Comprobar ✓</button></div><div class="message" id="message"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const TOTAL=195,STORAGE='banderquiz_mundo_beta_v3';
const FLAG_URL='https://cdn.jsdelivr.net/npm/country-flag-emoji-json@2.0.0/dist/index.json';
const countryES={"Afghanistan":"Afganistán","Albania":"Albania","Algeria":"Argelia","Andorra":"Andorra","Angola":"Angola","Antarctica":"Antártida","Antigua and Barbuda":"Antigua y Barbuda","Argentina":"Argentina","Armenia":"Armenia","Australia":"Australia","Austria":"Austria","Azerbaijan":"Azerbaiyán","Bahamas":"Bahamas","Bahrain":"Baréin","Bangladesh":"Bangladés","Barbados":"Barbados","Belarus":"Bielorrusia","Belgium":"Bélgica","Belize":"Belice","Benin":"Benín","Bhutan":"Bután","Bolivia":"Bolivia","Bosnia and Herzegovina":"Bosnia y Herzegovina","Botswana":"Botsuana","Brazil":"Brasil","Brunei":"Brunéi","Bulgaria":"Bulgaria","Burkina Faso":"Burkina Faso","Burundi":"Burundi","Cabo Verde":"Cabo Verde","Cambodia":"Camboya","Cameroon":"Camerún","Canada":"Canadá","Central African Republic":"República Centroafricana","Chad":"Chad","Chile":"Chile","China":"China","Colombia":"Colombia","Comoros":"Comoras","Congo":"República del Congo","Costa Rica":"Costa Rica","Croatia":"Croacia","Cuba":"Cuba","Cyprus":"Chipre","Czechia":"Chequia","Denmark":"Dinamarca","Djibouti":"Yibuti","Dominica":"Dominica","Dominican Republic":"República Dominicana","Ecuador":"Ecuador","Egypt":"Egipto","El Salvador":"El Salvador","Equatorial Guinea":"Guinea Ecuatorial","Eritrea":"Eritrea","Estonia":"Estonia","Eswatini":"Esuatini","Ethiopia":"Etiopía","Fiji":"Fiyi","Finland":"Finlandia","France":"Francia","Gabon":"Gabón","Gambia":"Gambia","Georgia":"Georgia","Germany":"Alemania","Ghana":"Ghana","Greece":"Grecia","Grenada":"Granada","Guatemala":"Guatemala","Guinea":"Guinea","Guinea-Bissau":"Guinea-Bisáu","Guyana":"Guyana","Haiti":"Haití","Honduras":"Honduras","Hungary":"Hungría","Iceland":"Islandia","India":"India","Indonesia":"Indonesia","Iran":"Irán","Iraq":"Irak","Ireland":"Irlanda","Israel":"Israel","Italy":"Italia","Jamaica":"Jamaica","Japan":"Japón","Jordan":"Jordania","Kazakhstan":"Kazajistán","Kenya":"Kenia","Kiribati":"Kiribati","Kuwait":"Kuwait","Kyrgyzstan":"Kirguistán","Laos":"Laos","Latvia":"Letonia","Lebanon":"Líbano","Lesotho":"Lesoto","Liberia":"Liberia","Libya":"Libia","Liechtenstein":"Liechtenstein","Lithuania":"Lituania","Luxembourg":"Luxemburgo","Madagascar":"Madagascar","Malawi":"Malaui","Malaysia":"Malasia","Maldives":"Maldivas","Mali":"Malí","Malta":"Malta","Marshall Islands":"Islas Marshall","Mauritania":"Mauritania","Mauritius":"Mauricio","Mexico":"México","Micronesia":"Micronesia","Moldova":"Moldavia","Monaco":"Mónaco","Mongolia":"Mongolia","Montenegro":"Montenegro","Morocco":"Marruecos","Mozambique":"Mozambique","Myanmar":"Myanmar","Namibia":"Namibia","Nauru":"Nauru","Nepal":"Nepal","Netherlands":"Países Bajos","New Zealand":"Nueva Zelanda","Nicaragua":"Nicaragua","Niger":"Níger","Nigeria":"Nigeria","North Korea":"Corea del Norte","North Macedonia":"Macedonia del Norte","Norway":"Noruega","Oman":"Omán","Pakistan":"Pakistán","Palau":"Palaos","Palestine":"Palestina","Panama":"Panamá","Papua New Guinea":"Papúa Nueva Guinea","Paraguay":"Paraguay","Peru":"Perú","Philippines":"Filipinas","Poland":"Polonia","Portugal":"Portugal","Qatar":"Catar","Romania":"Rumanía","Russia":"Rusia","Rwanda":"Ruanda","Saint Kitts and Nevis":"San Cristóbal y Nieves","Saint Lucia":"Santa Lucía","Saint Vincent and the Grenadines":"San Vicente y las Granadinas","Samoa":"Samoa","San Marino":"San Marino","Sao Tome and Principe":"Santo Tomé y Príncipe","Saudi Arabia":"Arabia Saudita","Senegal":"Senegal","Serbia":"Serbia","Seychelles":"Seychelles","Sierra Leone":"Sierra Leona","Singapore":"Singapur","Slovakia":"Eslovaquia","Slovenia":"Eslovenia","Solomon Islands":"Islas Salomón","Somalia":"Somalia","South Africa":"Sudáfrica","South Korea":"Corea del Sur","South Sudan":"Sudán del Sur","Spain":"España","Sri Lanka":"Sri Lanka","Sudan":"Sudán","Suriname":"Surinam","Sweden":"Suecia","Switzerland":"Suiza","Syria":"Siria","Taiwan":"Taiwán","Tajikistan":"Tayikistán","Tanzania":"Tanzania","Thailand":"Tailandia","Timor-Leste":"Timor Oriental","Togo":"Togo","Tonga":"Tonga","Trinidad and Tobago":"Trinidad y Tobago","Tunisia":"Túnez","Turkey":"Turquía","Turkmenistan":"Turkmenistán","Tuvalu":"Tuvalu","Uganda":"Uganda","Ukraine":"Ucrania","United Arab Emirates":"Emiratos Árabes Unidos","United Kingdom":"Reino Unido","United States":"Estados Unidos","United States of America":"Estados Unidos","Uruguay":"Uruguay","Uzbekistan":"Uzbekistán","Vanuatu":"Vanuatu","Vatican City":"Ciudad del Vaticano","Venezuela":"Venezuela","Vietnam":"Vietnam","Yemen":"Yemen","Zambia":"Zambia","Zimbabwe":"Zimbabue"};
const aliasesES={"eeuu":"Estados Unidos","e e u u":"Estados Unidos","usa":"Estados Unidos","us":"Estados Unidos","estados unidos de america":"Estados Unidos","estados unidos de américa":"Estados Unidos","republica dominicana":"República Dominicana","república dominicana":"República Dominicana","republica centroafricana":"República Centroafricana","republica del congo":"República del Congo","congo":"República del Congo","paises bajos":"Países Bajos","países bajos":"Países Bajos","holanda":"Países Bajos","corea del sur":"Corea del Sur","corea del norte":"Corea del Norte","emiratos arabes unidos":"Emiratos Árabes Unidos","emiratos árabes unidos":"Emiratos Árabes Unidos","sudafrica":"Sudáfrica","sudán del sur":"Sudán del Sur","sudan del sur":"Sudán del Sur","arabia saudita":"Arabia Saudita","arabia saudí":"Arabia Saudita","turquia":"Turquía","rusia":"Rusia","japon":"Japón","mexico":"México","panama":"Panamá","peru":"Perú","brasil":"Brasil","reino unido":"Reino Unido","ciudad del vaticano":"Ciudad del Vaticano","vaticano":"Ciudad del Vaticano","taiwan":"Taiwán","papua nueva guinea":"Papúa Nueva Guinea","santo tome y principe":"Santo Tomé y Príncipe","san cristobal y nieves":"San Cristóbal y Nieves","san cristóbal y nieves":"San Cristóbal y Nieves","san vicente y las granadinas":"San Vicente y las Granadinas","antigua y barbuda":"Antigua y Barbuda","bosnia y herzegovina":"Bosnia y Herzegovina","nueva zelanda":"Nueva Zelanda","guinea bisau":"Guinea-Bisáu","guinea-bisau":"Guinea-Bisáu","guinea bisáu":"Guinea-Bisáu","timor oriental":"Timor Oriental","macedonia del norte":"Macedonia del Norte"};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim();
let flagByName={};
function buildFlagIndex(list){flagByName={};for(const item of list||[]){if(!item?.name||!item?.image)continue;flagByName[norm(item.name)]=item}}
function spanishName(name){return countryES[name]||name}
function acceptedNames(mapName){return [spanishName(mapName),mapName]}
function flagForCountry(name){return flagByName[norm(name)]}
function showExternalFlag(name){const entry=flagForCountry(name),box=document.getElementById('flag');box.replaceChildren();if(!entry){box.innerHTML='<span class="flag-fallback">🏳️</span>';return}const img=document.createElement('img');img.alt=`Bandera de ${spanishName(name)}`;img.width=112;img.height=84;img.decoding='async';img.loading='eager';img.referrerPolicy='no-referrer';img.src=entry.image;img.onerror=()=>{box.innerHTML=`<span class="flag-fallback">${entry.emoji||'🏳️'}</span>`};box.appendChild(img)}
let state={done:[],score:0,streak:0},selected=null,mapReady=false;
const app=d3.select('#map'),svg=d3.select(document.createElementNS('http://www.w3.org/2000/svg','svg')).attr('viewBox','0 0 1000 600');app.node().appendChild(svg.node());const g=svg.append('g');
const projection=d3.geoEqualEarth().fitSize([1000,600],{type:'Sphere'}),path=d3.geoPath(projection);g.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#111936').attr('stroke','#3a4569');
const zoom=d3.zoom().scaleExtent([1,7]).translateExtent([[0,0],[1000,600]]).extent([[0,0],[1000,600]]).on('zoom',e=>g.attr('transform',e.transform));svg.call(zoom);
function save(){try{if(window.TecnoMathProgress)window.TecnoMathProgress.save('banderquiz-mundo',state);else localStorage.setItem(STORAGE,JSON.stringify(state))}catch(_){localStorage.setItem(STORAGE,JSON.stringify(state))}update()}
function update(){document.getElementById('fill').style.width=Math.min(100,state.done.length/TOTAL*100)+'%';document.getElementById('progressText').textContent=`${state.done.length} / ${TOTAL} países conquistados`;document.getElementById('score').textContent=state.score;document.getElementById('streak').textContent=state.streak}
function openCountry(name,node){if(state.done.includes(name))return;selected={name,node};showExternalFlag(name);document.getElementById('countryName').textContent='¿Qué país es?';document.getElementById('answer').value='';document.getElementById('message').textContent='';document.getElementById('message').className='message';document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('answer').focus(),80)}
function close(){document.getElementById('modal').classList.remove('show');selected=null}
function check(){if(!selected)return;const typed=norm(document.getElementById('answer').value),mapName=selected.name,alias=aliasesES[typed]||typed,accepted=acceptedNames(mapName).map(norm);if(accepted.includes(alias)||accepted.includes(typed)){if(!state.done.includes(mapName)){state.done.push(mapName);state.score+=100+state.streak*10;state.streak++;selected.node.classed('done',true)}document.getElementById('countryName').textContent=spanishName(mapName);document.getElementById('message').textContent='✓ ¡País conquistado! + puntos';document.getElementById('message').className='message ok';save();setTimeout(close,650)}else{state.streak=0;state.score=Math.max(0,state.score-20);document.getElementById('message').textContent='✗ No es correcto. Escribe el nombre en español';document.getElementById('message').className='message bad';save()}}
document.getElementById('check').onclick=check;document.getElementById('cancel').onclick=close;document.getElementById('back').onclick=()=>location.href='../menu.html';document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check();if(e.key==='Escape')close()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
const restoreProgress=async()=>{if(!window.TecnoMathProgress)return null;try{return await window.TecnoMathProgress.restore('banderquiz-mundo')}catch(_){return null}};
const loadFlags=async(ms=6000)=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(FLAG_URL,{cache:'no-store',signal:controller.signal,mode:'cors'});if(!r.ok)throw new Error('flags HTTP '+r.status);const data=await r.json();return Array.isArray(data)?data:[]}catch(_){return []}finally{clearTimeout(timer)}};
const WORLD_CACHE='banderquiz_mundo_world_v4';
const fetchJsonWithTimeout=async(url,ms=9000)=>{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal,mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data?.objects?.countries)throw new Error('invalid world');return data}finally{clearTimeout(timer)}};
const loadWorld=async()=>{
  try{const cached=localStorage.getItem(WORLD_CACHE);if(cached){const data=JSON.parse(cached);if(data?.objects?.countries)return data}}catch(_){ }
  const urls=[
    'https://cdn.jsdelivr.net/npm/visionscarto-world-atlas@1/world/110m.json',
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
    'https://unpkg.com/world-atlas@2/countries-110m.json',
    'https://raw.githubusercontent.com/topojson/world-atlas/master/countries-110m.json'
  ];
  const results=await Promise.allSettled(urls.map(url=>fetchJsonWithTimeout(url)));
  const winner=results.find(x=>x.status==='fulfilled');
  if(winner?.value){try{localStorage.setItem(WORLD_CACHE,JSON.stringify(winner.value))}catch(_){ }return winner.value}
  throw new Error('No se pudo descargar ninguna fuente del mapa')
};
Promise.all([
  loadWorld(),
  loadFlags()
]).then(async([world,flags])=>{
  state={done:[],score:0,streak:0};
  buildFlagIndex(flags);
  const countries=topojson.feature(world,world.objects.countries);
  g.selectAll('.country').data(countries.features).join('path').attr('class','country').attr('d',path).on('click',(e,d)=>{const name=d.properties?.name;if(name)openCountry(name,d3.select(e.currentTarget))});
  g.selectAll('.country').classed('done',d=>state.done.includes(d.properties?.name));
  mapReady=true;update();
  window.addEventListener('resize',()=>svg.call(zoom.transform,d3.zoomIdentity));
  const restored=await restoreProgress();
  if(restored&&Array.isArray(restored.done)){state={done:restored.done,score:Number(restored.score)||0,streak:Number(restored.streak)||0};g.selectAll('.country').classed('done',d=>state.done.includes(d.properties?.name));update()}
  window.addEventListener('tecnomath:authchange',async(e)=>{
    const user=e.detail?.user||null;
    if(!user){state={done:[],score:0,streak:0};close();g.selectAll('.country').classed('done',false);update();return}
    try{const next=await window.TecnoMathProgress?.restore('banderquiz-mundo');state={done:Array.isArray(next?.done)?next.done:[],score:Number(next?.score)||0,streak:Number(next?.streak)||0};g.selectAll('.country').classed('done',d=>state.done.includes(d.properties?.name));update()}catch(_){state={done:[],score:0,streak:0};g.selectAll('.country').classed('done',false);update()}
  });
  window.addEventListener('tecnomath:signed-out',()=>{state={done:[],score:0,streak:0};close();g.selectAll('.country').classed('done',false);update()});
}).catch(()=>{
  document.getElementById('progressText').textContent='No se pudo cargar el mapa. Pulsa aquí para reintentar.';
  const retry=document.createElement('button');retry.textContent='↻ Reintentar mapa';retry.className='back';retry.style.cssText='position:fixed;z-index:40;top:72px;left:50%;transform:translateX(-50%);font-size:.9rem';retry.onclick=()=>location.reload();document.body.appendChild(retry);
});
</script></body></html>
