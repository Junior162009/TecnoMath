<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treasure Math</title><style>body{text-align:center;background:#17414b;color:white;font-family:Arial}#t{font-size:100px;margin:25px}button{padding:15px;margin:6px;font-size:21px}</style><h1>💎 Treasure Math</h1><div id=t>🗺️ ➜ ❓</div><div id=q></div><div id=a></div><script src="/js/tecnomath-progress.js?v=4"></script><script>function n(){let x=10+~~(Math.random()*20),y=2+~~(Math.random()*10),c=x+y;q.textContent=`Abre el tesoro: ${x}+${y}`;a.innerHTML=[c,c+5,c-5,c+8].sort(()=>Math.random()-.5).map(v=>`<button onclick="go(${v===c})">💎 ${v}</button>`).join('')}function go(ok){t.textContent=ok?'💰🎉':'🗺️ ➜ ❓';if(window.TecnoMathProgress)TecnoMathProgress.record({games:1,correct:+ok,wrong:+!ok,xp:ok?15:0,coins:ok?8:0,topic:'Treasure Math'});setTimeout(n,300)}n()</script>
