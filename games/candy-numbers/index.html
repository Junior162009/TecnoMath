<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candy Numbers</title><style>body{text-align:center;background:#ffd8ed;font-family:Arial;color:#612}button{font-size:30px;padding:20px;margin:8px;border-radius:20px;border:0}#q{font-size:28px;margin:30px}</style><h1>🍬 Candy Numbers</h1><div id=q></div><div id=a></div><script src="/js/tecnomath-progress.js?v=4"></script><script>function n(){let x=2+~~(Math.random()*8),y=2+~~(Math.random()*8),c=x*y;q.textContent=`Encuentra el dulce: ${x} × ${y}`;a.innerHTML=[c,c+1,c-1,c+4].sort(()=>Math.random()-.5).map(v=>`<button onclick="go(${v===c})">🍬 ${v}</button>`).join('')}function go(ok){if(window.TecnoMathProgress)TecnoMathProgress.record({games:1,correct:+ok,wrong:+!ok,xp:ok?10:0,coins:ok?4:0,topic:'Candy Numbers'});n()}n()</script>
