<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Racer</title><style>body{text-align:center;background:#333;color:white;font-family:Arial}#car{font-size:90px;margin:25px}button{padding:15px;margin:6px;font-size:21px}</style><h1>🏎️ Math Racer</h1><div id=car>🏎️</div><div id=q></div><div id=a></div><script src="/js/tecnomath-progress.js?v=4"></script><script>function n(){let x=2+~~(Math.random()*10),y=2+~~(Math.random()*10),c=x*y;q.textContent=`Turbo: ${x} × ${y}=?`;a.innerHTML=[c,c+3,c-3,c+6].sort(()=>Math.random()-.5).map(v=>`<button onclick="go(${v===c})">${v}</button>`).join('')}function go(ok){car.animate([{transform:'translateX(0)'},{transform:`translateX(${ok?120:-30}px)`},{transform:'translateX(0)'}],{duration:450});if(window.TecnoMathProgress)TecnoMathProgress.record({games:1,correct:+ok,wrong:+!ok,xp:ok?15:0,coins:ok?4:0,topic:'Math Racer'});n()}n()</script>
