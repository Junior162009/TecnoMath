            border: none;
            padding: 0.9rem 2.5rem;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;

            border-color: #ff0055;
            color: #ff0055;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.1);

            background: linear-gradient(135deg, #7b2ffc, #ff00e5);
            border: none;
            padding: 0.8rem 2rem;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            border-radius: 60px;

        }

        .ayudas-panel {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .ayuda-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            color: #c8d0e0;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .ayuda-btn:active:not(:disabled) { transform: scale(0.97); }
        .ayuda-btn:disabled, .ayuda-btn.disabled { opacity: 0.4; cursor: not-allowed; }

        .ayuda-btn:hover:not(:disabled) {
            border-color: #ffdd00;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 221, 0, 0.05);
        }

        .ayuda-count {
            background: rgba(0,0,0,0.3);

            border-radius: 4px;
            font-size: 0.5rem;
            color: #ffdd00;
        }

        .hidden { display: none; }

        .game-over-retro {
            text-align: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .reiniciar-retro {
            background: linear-gradient(135deg, #ffdd00, #ff8844);
            border: none;
            padding: 0.7rem 1.5rem;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            margin-top: 1rem;
            cursor: pointer;
            border-radius: 60px;
            color: #0a0e1a;
            font-size: 0.7rem;
            transition: all 0.3s ease;
        }

        .reiniciar-retro:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 221, 0, 0.2);
        }

        .pista-mensaje {
            background: rgba(0, 245, 255, 0.05);
            color: #00f5ff;
            padding: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.5rem;
            text-align: center;
            min-height: 30px;
            border-radius: 10px;
            border: 1px solid rgba(0, 245, 255, 0.1);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .minijuegos-btn {
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #ff00e5, #7b2ffc);
            border: none;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 0, 229, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;

        }

        .minijuegos-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 0, 229, 0.4);
        }

        @media (min-width: 600px) {
            .opciones-retro { grid-template-columns: repeat(2, 1fr); }
            .start-screen, .game-screen { padding: 2.5rem 3rem 3rem; }
        }
    </style>

            saltos: 0,
            preguntasPool: [],
            indiceActual: 0,
            preguntaActualObj: null,
            respondida: false,
            juegoActivo: false,
            timerSeg: 15,
            intervalo: null,
            pistaUsadaEnEstaPregunta: false
        };

        function guardarProgreso() {}
        function cargarProgreso() {
            gameState.monedas = 0;
            gameState.puntuacion = 0;
            gameState.vidas = 3;
            gameState.pistas = 0;
            gameState.saltos = 0;
        }

        function irATienda() { window.location.href = "tienda.html"; }
        function irAMinijuegos() { window.location.href = "minijuego.html"; }

        function mezclarArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function cargarPreguntasMateria() {
            const base = BANCO[gameState.materia];
            gameState.preguntasPool = mezclarArray([...base]).slice(0, 10);
            gameState.indiceActual = 0;
        }

        function obtenerPregunta() {
            if (gameState.indiceActual < gameState.preguntasPool.length)
                return gameState.preguntasPool[gameState.indiceActual];
            return null;
        }

        function usarPista() {
            if (!gameState.juegoActivo || gameState.respondida) {
                mostrarMensajeTemp("⚠️ NO PUEDES USAR PISTA");
                return;
            }
            if (gameState.pistaUsadaEnEstaPregunta) {
                mostrarMensajeTemp("💡 YA USASTE UNA PISTA");
                return;
            }
            if (gameState.pistas <= 0) {
                mostrarMensajeTemp("❌ SIN PISTAS. ¡COMPRA!");
                return;
            }

            const pregunta = gameState.preguntaActualObj;
            const correctaIdx = pregunta.correcta;
            const incorrectos = [];
            
            for (let i = 0; i < pregunta.opciones.length; i++) {
                if (i !== correctaIdx) incorrectos.push(i);
            }
            
            const mezclados = mezclarArray([...incorrectos]);
            const eliminar = mezclados.slice(0, Math.min(1, incorrectos.length - 1));
            
            const botones = document.querySelectorAll('.opcion-retro');
            eliminar.forEach(idx => {
                if (botones[idx]) {
                    botones[idx].classList.add('oculta');
                    botones[idx].style.display = 'none';
                }
            });
            
            gameState.pistas--;
            gameState.pistaUsadaEnEstaPregunta = true;
            actualizarStatsJuego();
            actualizarBotonesAyudas();
            mostrarMensajeTemp("🔮 ¡OPCIÓN ELIMINADA!", "success");
        }

        function usarSaltar() {
            if (!gameState.juegoActivo || gameState.respondida) {
                mostrarMensajeTemp("⚠️ NO PUEDES SALTAR");
                return;
            }
            if (gameState.saltos <= 0) {
                mostrarMensajeTemp("❌ SIN SALTOS. ¡COMPRA!");
                return;
            }

            gameState.saltos--;
            actualizarStatsJuego();
            actualizarBotonesAyudas();
            mostrarMensajeTemp("⏩ ¡SALTANDO PREGUNTA!", "success");
            
            detenerTimer();
            gameState.respondida = true;
            avanzarPregunta();
        }

        function mostrarMensajeTemp(msg, tipo = "normal") {
            const msgDiv = document.getElementById('mensajeTemporal');
            if (msgDiv) {
                msgDiv.textContent = msg;
                msgDiv.style.background = tipo === "success" ? "rgba(0,255,157,0.1)" : "rgba(255,255,255,0.05)";
                msgDiv.style.borderColor = tipo === "success" ? "rgba(0,255,157,0.2)" : "rgba(255,255,255,0.06)";
                setTimeout(() => {
                    if (msgDiv) msgDiv.textContent = "";
                }, 2500);
            }
        }

        function actualizarBotonesAyudas() {
            const pistaBtn = document.getElementById('ayudaPistaBtn');
            const saltarBtn = document.getElementById('ayudaSaltarBtn');
            const pistaCount = document.getElementById('pistaCount');
            const saltarCount = document.getElementById('saltarCount');
            
            if (pistaBtn) {
                pistaBtn.disabled = (gameState.pistas <= 0 || gameState.respondida || gameState.pistaUsadaEnEstaPregunta || !gameState.juegoActivo);
                if (pistaBtn.disabled) pistaBtn.classList.add('disabled');
                else pistaBtn.classList.remove('disabled');
            }
            if (saltarBtn) {
                saltarBtn.disabled = (gameState.saltos <= 0 || gameState.respondida || !gameState.juegoActivo);
                if (saltarBtn.disabled) saltarBtn.classList.add('disabled');
                else saltarBtn.classList.remove('disabled');
            }
            if (pistaCount) pistaCount.innerText = gameState.pistas;
            if (saltarCount) saltarCount.innerText = gameState.saltos;
        }

        const appRoot = document.getElementById("appRoot");
        let refreshInterval = null;

        function renderStartScreen() {
            if (refreshInterval) clearInterval(refreshInterval);
            
            appRoot.innerHTML = `
                <div class="start-screen">
                    <div class="header-glow"></div>
                    <div class="game-logo">TECNOBRAINMATH</div>
                    <div class="game-logo-sub">✦ TRIVIA CHALLENGE ✦</div>
                    <div class="sub">▸ PRESS START TO PLAY ◂</div>
                    
                    <div class="resources-panel">
                        <div class="resource coins">🪙 <span class="resource-value" id="monedasStart">${gameState.monedas}</span></div>
                        <div class="resource score">🏆 <span class="resource-value" id="puntosStart">${gameState.puntuacion}</span></div>
                        <div class="resource lives">❤️ <span class="resource-value" id="vidasStart">${gameState.vidas}</span></div>
                    </div>
                    
                    <div class="resources-panel" style="border-color:rgba(255,221,0,0.1); gap:2rem;">
                        <div class="resource">💡 <span class="resource-value" id="pistasStart">${gameState.pistas}</span></div>
                        <div class="resource">⏩ <span class="resource-value" id="saltosStart">${gameState.saltos}</span></div>
                    </div>
                    
                    <div class="materias-reto">
                        <div class="card-materia ${gameState.materia === 'historia' ? 'seleccionada' : ''}" data-mat="historia">
                            <div class="materia-icono">📜</div>
                            <div class="materia-nombre">HISTORIA Y CÍVICA</div>
                        </div>
                        <div class="card-materia ${gameState.materia === 'matematicas' ? 'seleccionada' : ''}" data-mat="matematicas">
                            <div class="materia-icono">🧮</div>
                            <div class="materia-nombre">MATEMÁTICAS</div>
                        </div>
                        <div class="card-materia ${gameState.materia === 'lectura' ? 'seleccionada' : ''}" data-mat="lectura">
                            <div class="materia-icono">📖</div>
                            <div class="materia-nombre">LECTURA CRÍTICA</div>
                        </div>
                    </div>
                    
                    <button class="btn-primary" id="startGameBtn">▶ INICIAR RETO</button>
                    
                    <div class="button-group">
                        <button class="btn-secondary gold" id="openShopBtn">🛒 TIENDA MISTERIOSA</button>
                        <button class="minijuegos-btn" id="openMinijuegosBtn">
                            <span class="icon">🎮</span> MINIJUEGOS
                        </button>
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.card-materia').forEach(card => {
                card.addEventListener('click', () => {
                    gameState.materia = card.dataset.mat;
                    renderStartScreen();
                });
            });
            
            document.getElementById('startGameBtn').addEventListener('click', iniciarJuego);
            document.getElementById('openShopBtn').addEventListener('click', irATienda);
            document.getElementById('openMinijuegosBtn').addEventListener('click', irAMinijuegos);
            
            refreshInterval = setInterval(() => {
                const monedasSpan = document.getElementById('monedasStart');
                const puntosSpan = document.getElementById('puntosStart');
                const vidasSpan = document.getElementById('vidasStart');
                const pistasSpan = document.getElementById('pistasStart');
                const saltosSpan = document.getElementById('saltosStart');
                if (monedasSpan) monedasSpan.innerText = gameState.monedas;
                if (puntosSpan) puntosSpan.innerText = gameState.puntuacion;
                if (vidasSpan) vidasSpan.innerText = gameState.vidas;
                if (pistasSpan) pistasSpan.innerText = gameState.pistas;
                if (saltosSpan) saltosSpan.innerText = gameState.saltos;
            }, 200);
        }

        function detenerTimer() {
            if (gameState.intervalo) {
                clearInterval(gameState.intervalo);
                gameState.intervalo = null;
            }
        }

        function iniciarTimerJuego() {
            detenerTimer();
            gameState.timerSeg = 15;
            const timerSpan = document.getElementById('timerGameValue');
            if (timerSpan) timerSpan.innerText = gameState.timerSeg;
            gameState.intervalo = setInterval(() => {
                if (!gameState.juegoActivo || gameState.respondida) return;
                gameState.timerSeg--;
                if (timerSpan) timerSpan.innerText = gameState.timerSeg;
                if (gameState.timerSeg <= 0) {
                    detenerTimer();
                    if (gameState.juegoActivo && !gameState.respondida) {
                        manejarRespuestaJuego(-1);
                    }
                }
            }, 1000);
        }

        function actualizarStatsJuego() {
            const vidasSpan = document.getElementById('gameVidas');
            const puntosSpan = document.getElementById('gamePuntos');
            const monedasSpan = document.getElementById('gameMonedas');
            const pistasSpan = document.getElementById('gamePistas');
            const saltosSpan = document.getElementById('gameSaltos');
            if (vidasSpan) vidasSpan.innerText = gameState.vidas;
            if (puntosSpan) puntosSpan.innerText = gameState.puntuacion;
            if (monedasSpan) monedasSpan.innerText = gameState.monedas;
            if (pistasSpan) pistasSpan.innerText = gameState.pistas;
            if (saltosSpan) saltosSpan.innerText = gameState.saltos;
        }

        function manejarRespuestaJuego(seleccion) {
            if (!gameState.juegoActivo || gameState.respondida) return;
            detenerTimer();
            gameState.respondida = true;
            const esCorrecta = (seleccion === gameState.preguntaActualObj.correcta);
            
            if (esCorrecta) {
                gameState.puntuacion += 100;
                if (gameState.timerSeg > 0) gameState.puntuacion += gameState.timerSeg * 2;
                gameState.monedas += 5;
            } else {
                gameState.vidas -= 1;
            }
            
            actualizarStatsJuego();
            
            const btns = document.querySelectorAll('.opcion-retro');
            btns.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === gameState.preguntaActualObj.correcta) btn.classList.add('correcta');
                if (idx === seleccion && !esCorrecta && seleccion !== -1) btn.classList.add('incorrecta');
            });
            
            if (gameState.vidas <= 0) {
                setTimeout(() => finalizarJuego(), 1000);
                return;
            }
            
            const nextBtn = document.getElementById('siguienteRetroBtn');
            if (nextBtn) nextBtn.classList.remove('hidden');
            actualizarBotonesAyudas();
        }

        function avanzarPregunta() {
            if (!gameState.juegoActivo) return;
            gameState.respondida = false;
            gameState.pistaUsadaEnEstaPregunta = false;
            gameState.indiceActual++;
            const nueva = obtenerPregunta();
            if (!nueva) {
                gameState.puntuacion += 80;
                finalizarJuego(true);
                return;
            }
            gameState.preguntaActualObj = nueva;
            renderGameScreen();
            iniciarTimerJuego();
        }

        function renderGameScreen() {
            const p = gameState.preguntaActualObj;
            const letras = ['A', 'B', 'C', 'D'];
            let opcionesHtml = '';
            p.opciones.forEach((opt, idx) => {
                opcionesHtml += `
                    <button class="opcion-retro" data-idx="${idx}">
                        <span class="letra-pixel">${letras[idx]}</span>
                        ${opt}
                    </button>
                `;
            });
            
            const html = `
                <div class="game-screen">
                    <div class="header-glow"></div>
                    <div class="game-logo" style="font-size:1.5rem;">TECNOBRAINMATH</div>
                    <div class="game-logo-sub" style="font-size:0.5rem;">✦ TRIVIA CHALLENGE ✦</div>
                    <div class="game-header">
                        <div class="stat-retro">❤️ <span id="gameVidas">${gameState.vidas}</span></div>
                        <div class="stat-retro">🏆 <span id="gamePuntos">${gameState.puntuacion}</span></div>
                        <div class="stat-retro">🪙 <span id="gameMonedas">${gameState.monedas}</span></div>
                        <div class="stat-retro">⏱️ <span id="timerGameValue">${gameState.timerSeg}</span>s</div>
                    </div>
                    <div class="pregunta-box">
                        <div class="pregunta-text">${p.pregunta}</div>
                    </div>
                    <div class="opciones-retro" id="opcionesRetroContainer">
                        ${opcionesHtml}
                    </div>
                    <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
                        <button class="btn-siguiente-retro hidden" id="siguienteRetroBtn">➡️ SIGUIENTE</button>
                    </div>
                    
                    <div class="ayudas-panel">
                        <button class="ayuda-btn" id="ayudaPistaBtn">
                            💡 PISTA <span class="ayuda-count" id="pistaCount">${gameState.pistas}</span>
                        </button>
                        <button class="ayuda-btn" id="ayudaSaltarBtn">
                            ⏩ SALTAR <span class="ayuda-count" id="saltarCount">${gameState.saltos}</span>
                        </button>
                        <button class="btn-secondary gold" id="openShopFromGame" style="margin-top:0; padding:0.4rem 1.2rem; font-size:0.5rem;">🛒 TIENDA</button>
                    </div>
                    <div id="mensajeTemporal" class="pista-mensaje"></div>
                </div>
            `;
            appRoot.innerHTML = html;
            
            document.querySelectorAll('.opcion-retro').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!gameState.juegoActivo || gameState.respondida) return;
                    const idx = parseInt(btn.dataset.idx);
                    manejarRespuestaJuego(idx);
                });
            });
            
            document.getElementById('siguienteRetroBtn')?.addEventListener('click', avanzarPregunta);
            document.getElementById('ayudaPistaBtn')?.addEventListener('click', usarPista);
            document.getElementById('ayudaSaltarBtn')?.addEventListener('click', usarSaltar);
            document.getElementById('openShopFromGame')?.addEventListener('click', irATienda);
            
            actualizarBotonesAyudas();
        }

        function finalizarJuego(completado = false) {
            detenerTimer();
            gameState.juegoActivo = false;
            const mensaje = completado ? "🏆 ¡RETO COMPLETADO!" : "💀 GAME OVER";
            appRoot.innerHTML = `
                <div class="game-screen">
                    <div class="game-over-retro">
                        <div class="game-logo" style="font-size:1.3rem;">TECNOBRAINMATH</div>
                        <div style="font-size:0.5rem; color:#ff00e5; margin-bottom:0.5rem;">✦ TRIVIA CHALLENGE ✦</div>
                        <h2 style="color:#00f5ff; font-size:1.2rem;">${mensaje}</h2>
                        <p style="margin:1rem 0; font-size:0.7rem; color:#c8d0e0;">🏅 PTS: <span style="color:#ffdd00;">${gameState.puntuacion}</span><br>🪙 MONEDAS: <span style="color:#ffdd00;">${gameState.monedas}</span><br>💡 PISTAS: <span style="color:#ffdd00;">${gameState.pistas}</span> | ⏩ SALTOS: <span style="color:#ffdd00;">${gameState.saltos}</span></p>
                        <button class="reiniciar-retro" id="volverInicioBtn">🔄 VOLVER AL INICIO</button>
                        <br><br>
                        <button class="btn-secondary gold" id="shopFromGameOver">🛒 TIENDA</button>
                        <br>
                        <button class="minijuegos-btn" id="minijuegosFromGameOver" style="font-size:0.6rem; padding:0.6rem 1.5rem; margin-top:0.5rem;">
                            <span class="icon">🎮</span> MINIJUEGOS
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('volverInicioBtn')?.addEventListener('click', () => {
                renderStartScreen();
            });
            document.getElementById('shopFromGameOver')?.addEventListener('click', irATienda);
            document.getElementById('minijuegosFromGameOver')?.addEventListener('click', irAMinijuegos);
        }

        function iniciarJuego() {
            detenerTimer();
            cargarPreguntasMateria();
            const primera = obtenerPregunta();
            if (!primera) return;
            gameState.preguntaActualObj = primera;
            gameState.respondida = false;
            gameState.juegoActivo = true;
            gameState.pistaUsadaEnEstaPregunta = false;
            renderGameScreen();
            iniciarTimerJuego();
        }

        cargarProgreso();
        renderStartScreen();
    </script>
    <script src="tecnobrainmath-courses.js?v=20261013-2"></script>
</body>
</html>
