<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TECNOBRAINMATH · Tienda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 245, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255, 0, 229, 0.08) 0%, transparent 50%);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 245, 255, 0.2), 0 0 60px rgba(0, 245, 255, 0.05); }
            50% { box-shadow: 0 0 40px rgba(0, 245, 255, 0.4), 0 0 80px rgba(0, 245, 255, 0.1); }
        }

        .shop-container {
            max-width: 520px;
            width: 100%;
            background: linear-gradient(145deg, rgba(13, 11, 26, 0.95), rgba(20, 15, 40, 0.95));
            border-radius: 32px;
            padding: 2.5rem;
            border: 1px solid rgba(0, 245, 255, 0.15);
            animation: glowPulse 3s ease-in-out infinite;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            position: relative;
        }

        .header-glow {
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f5ff, #ff00e5, transparent);
            border-radius: 50%;
            filter: blur(2px);
        }

        .shop-logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #00f5ff, #7b2ffc, #ff00e5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.2rem;
        }

        .shop-sub {
            text-align: center;
            font-size: 0.6rem;
            color: #ff00e5;
            margin-bottom: 0.5rem;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .shop-brand {
            text-align: center;
            font-size: 0.5rem;
            color: #7b8a9f;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        .monedas-display {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 221, 0, 0.15);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .monedas-display .icon { font-size: 1.8rem; }
        .monedas-display .label { font-size: 0.7rem; color: #7b8a9f; font-weight: 600; }
        .monedas-display .valor { color: #ffdd00; font-size: 1.8rem; font-weight: 800; }

        .inventario {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .inventario h3 {
            font-size: 0.6rem;
            color: #7b8a9f;
            margin-bottom: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .inventario-items {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .inv-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.6rem;
            color: #c8d0e0;
            font-weight: 600;
        }

        .inv-item span {
            color: #ffdd00;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .producto {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            transition: all 0.3s ease;
        }

        .producto:hover {
            border-color: rgba(0, 245, 255, 0.2);
        }

        .info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .info .icono { font-size: 1.8rem; }
        .info .desc { font-size: 0.55rem; text-align: left; font-weight: 600; color: #c8d0e0; line-height: 1.4; }
        .info .desc span { color: #7b8a9f; font-weight: 400; font-size: 0.5rem; }

        .precio {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(0,0,0,0.3);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffdd00;
            border: 1px solid rgba(255, 221, 0, 0.1);
        }

        .comprar-btn {
            background: linear-gradient(135deg, #ffdd00, #ff8844);
            border: none;
            padding: 0.5rem 1.2rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.55rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 60px;
            transition: all 0.3s ease;
            color: #0a0e1a;
        }

        .comprar-btn:active:not(:disabled) { transform: scale(0.97); }
        .comprar-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .comprar-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 221, 0, 0.2);
        }

        .mensaje {
            margin-top: 1.5rem;
            padding: 0.8rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.5rem;
            min-height: 50px;
            font-weight: 600;
            color: #7b8a9f;
        }

        .success { background: rgba(0, 255, 157, 0.05); color: #00ff9d; border-color: rgba(0, 255, 157, 0.1); }
        .error { background: rgba(255, 0, 85, 0.05); color: #ff0055; border-color: rgba(255, 0, 85, 0.1); }

        .volver-btn {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            color: #c8d0e0;
            font-size: 0.55rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .volver-btn:hover {
            border-color: #ffdd00;
            color: #ffffff;
        }

        hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.06); margin: 1rem 0; }
    </style>
    <script src="/js/i18n.js" defer></script>
</head>
<body>
    <div class="shop-container">
        <div class="header-glow"></div>
        <div class="shop-logo">TECNOBRAINMATH</div>
        <div class="shop-sub">✦ TIENDA MISTERIOSA ✦</div>
        <div class="shop-brand">⚡ TRIVIA CHALLENGE ⚡</div>
        
        <div class="monedas-display">
            <span class="icon">🪙</span>
            <span class="label">TUS MONEDAS:</span>
            <span class="valor" id="monedasActuales">0</span>
        </div>

        <div class="inventario">
            <h3>🎒 TU INVENTARIO</h3>
            <div class="inventario-items">
                <div class="inv-item">💡 PISTAS: <span id="invPistas">0</span></div>
                <div class="inv-item">⏩ SALTOS: <span id="invSaltos">0</span></div>
            </div>
        </div>

        <div class="producto">
            <div class="info">
                <span class="icono">💡</span>
                <div class="desc">PISTA<br><span>ELIMINA 2 FALSAS</span></div>
            </div>
            <div class="precio">🪙 10</div>
            <button class="comprar-btn" id="btnPista">COMPRAR</button>
        </div>

        <div class="producto">
            <div class="info">
                <span class="icono">⏩</span>
                <div class="desc">SALTAR<br><span>SIGUIENTE PREGUNTA</span></div>
            </div>
            <div class="precio">🪙 10</div>
            <button class="comprar-btn" id="btnSaltar">COMPRAR</button>
        </div>

        <hr>

        <div class="mensaje" id="mensajeArea">🎮 SELECCIONA UNA AYUDA</div>
        
        <button class="volver-btn" id="volverBtn">← VOLVER A LA TRIVIA</button>
    </div>

    <script>
        let monedasActuales = 0, pistasActuales = 0, saltosActuales = 0;

        function cargarDatos() {
            monedasActuales = 0; pistasActuales = 0; saltosActuales = 0;
            document.getElementById('monedasActuales').textContent = monedasActuales;
            document.getElementById('invPistas').textContent = pistasActuales;
            document.getElementById('invSaltos').textContent = saltosActuales;
        }

        function mostrarMensaje(texto, tipo) {
            const msgDiv = document.getElementById('mensajeArea');
            msgDiv.textContent = texto;
            msgDiv.className = `mensaje ${tipo}`;
            setTimeout(() => {
                msgDiv.className = 'mensaje';
                msgDiv.innerHTML = '🎮 SELECCIONA UNA AYUDA';
            }, 2500);
        }

        function comprarPista() {
            if (monedasActuales >= 10) {
                monedasActuales -= 10;
                pistasActuales += 1;
                document.getElementById('monedasActuales').textContent = monedasActuales;
                document.getElementById('invPistas').textContent = pistasActuales;
                mostrarMensaje("✅ ¡PISTA COMPRADA! (+1)", "success");
            } else {
                mostrarMensaje("❌ MONEDAS INSUFICIENTES", "error");
            }
        }

        function comprarSaltar() {
            if (monedasActuales >= 10) {
                monedasActuales -= 10;
                saltosActuales += 1;
                document.getElementById('monedasActuales').textContent = monedasActuales;
                document.getElementById('invSaltos').textContent = saltosActuales;
                mostrarMensaje("✅ ¡SALTO COMPRADO! (+1)", "success");
            } else {
                mostrarMensaje("❌ MONEDAS INSUFICIENTES", "error");
            }
        }

        function volverATrivia() {
            window.location.href = "index.html";
        }

        document.getElementById('btnPista').addEventListener('click', comprarPista);
        document.getElementById('btnSaltar').addEventListener('click', comprarSaltar);
        document.getElementById('volverBtn').addEventListener('click', volverATrivia);
        
        cargarDatos();
    </script>
</body>
</html>
