<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Math</title><style>body{margin:0;background:#05051b;color:white;font-family:Arial;text-align:center}#ship{font-size:90px;margin:30px}button{padding:16px;margin:7px;font-size:22px;border-radius:14px}#q{font-size:32px}</style><h1>🚀 Space Math</h1><div id=ship>🚀</div><div id=q></div><div id=a></div><script src="/js/tecnomath-progress.js?v=4"></script><script>function next(){let x=2+~~(Math.random()*9),y=2+~~(Math.random()*9),c=x*y;q.textContent=`${x} × ${y} = ?`;let o=[c,c+x,c-y,c+5].sort(()=>Math.random()-.5);a.innerHTML=o.map(n=>`<button onclick="ans(${n===c})">${n}</button>`).join('')}function ans(ok){ship.animate(ok?[{transform:'translateY(0)'},{transform:'translateY(-80px)'}]:[{transform:'translateX(0)'},{transform:'translateX(25px)'},{transform:'translateX(-25px)'}],{duration:450});if(window.TecnoMathProgress)TecnoMathProgress.record({games:1,correct:+ok,wrong:+!ok,xp:ok?12:0,coins:ok?3:0,topic:'Space Math'});next()}next()</script></html>
